t[i] == 1) {\n            printf(\"%d \", i);\n        }\n    }\n\n    return 0;\n}\n", "reflection": "今天的坑：不是所有排序题都要真的交换数组元素。只要数字范围小且明确，就可以用“下标当数字”的桶数组。\n复习点：数组下标；标记数组；桶排序思想；去重和升序输出如何同时完成。", "imgs": []}, {"id": 107, "date": "刷题第二天", "title": "BC44 判断整数奇偶性 [多组输入]", "topics": "牛客网BC44；奇偶判断；多组输入；while循环；EOF；取余", "summary": "题目：BC44 判断整数奇偶性\n\n题意：多组输入，每行输入一个整数，判断它是奇数还是偶数。偶数输出 Even，奇数输出 Odd。\n\n这次代码里的关键问题：\n\n1. while 后面的括号不能为空\n错误：\nwhile()\n\nwhile 的括号里必须写循环条件。它的意思是“只要条件成立，就继续执行大括号里的代码”。\n\n2. 多组输入要用 scanf 的返回值判断是否读到结尾\n正确写法：\nwhile (scanf(\"%lld\", &aa) != EOF)\n\n这句话的意思是：只要还能成功读到一个整数，就继续循环；牛客没有更多输入时，scanf 会返回 EOF，循环结束。\n\n3. 判断奇偶用取余\n如果一个数除以 2 的余数是 0，就是偶数：\nif (aa % 2 == 0)\n\n否则就是奇数。\n\n4. 多组输出通常每组要换行\n题目样例是：\nEven\nOdd\n\n所以 printf 后面要带 \n：\nprintf(\"Even\n\");\nprintf(\"Odd\n\");\n\n这题的记忆点：\n看到“多组输入，每行输入一个整数”，脑子里先冒出 while (scanf(...) != EOF)。", "codex": "【笔记名称】\nBC44 判断整数奇偶性 [多组输入]\n\n【天数】\n刷题第二天\n\n【题目】\n牛客网 BC44 判断整数奇偶性\n\n【这题的故事】\n这题本身只需要判断 aa % 2 是否等于 0，但真正卡住的是多组输入。代码里写了 while()，括号里面没有条件，所以直接编译错误。多组输入不能只 scanf 一次，要把 scanf 放进 while 条件里：只要还能读到整数，就继续判断下一行。\n\n【核心坑点】\n- while 的括号不能为空，必须有循环条件\n- 多组输入常用 while (scanf(\"%lld\", &aa) != EOF)\n- scanf 读 long long 要用 %lld\n- aa % 2 == 0 表示偶数\n- 每一组输出后加 \n，避免结果挤在一起\n\n【一句话记忆】\n多组输入就让 scanf 坐在 while 门口：读得到就进门，读不到 EOF 就结束。", "code": "#include <stdio.h>\n\nint main()\n{\n    long long aa = 0;\n\n    while (scanf(\"%lld\", &aa) != EOF) {\n        if (aa % 2 == 0) {\n            printf(\"Even\n\");\n        } else {\n            printf(\"Odd\n\");\n        }\n    }\n\n    return 0;\n}\n", "reflection": "今天的坑：while 不是装饰品，括号里必须有判断条件。遇到牛客“多组输入”，优先想到 while (scanf(...) != EOF)。\n复习点：while 循环条件；scanf 返回值；EOF；long long 和 %lld；取余判断奇偶。", "imgs": []}, {"id": 106, "date": "刷题第二天", "title": "BC38 变种水仙花 [循环枚举]", "topics": "牛客网BC38；变种水仙花；for循环；整数拆分；取余；整除；累加器", "summary": "题目：BC38 变种水仙花\n\n题意：求出 5 位数中的所有 Lily Number。把一个数从中间拆成两部分，把所有拆法的“左边 * 右边”加起来，如果结果等于这个数本身，它就是 Lily Number。\n\n例子：\n655 = 6 * 55 + 65 * 5\n1461 = 1 * 461 + 14 * 61 + 146 * 1\n\n这次代码里的主要错误：\n\n1. for 循环条件写成了赋值\n错误：\nfor (i = start; i = 100000; i++)\n\n这里的 i = 100000 是赋值，不是比较，会让循环条件一直偏离本意。\n正确写法：\nfor (i = start; i <= end; i++)\n\n2. 内层 mask 循环也写成了赋值\n错误：\nfor (mask = 10; mask = 1000; mask *= 10)\n\n正确写法：\nfor (mask = 10; mask <= 10000; mask *= 10)\n\n5 位数要拆 4 次：\nmask = 10、100、1000、10000\n\n3. 拆数公式写死了个位\n错误：\nsum += (i % 10) * (i / 10);\n\n这只拆了一种情况：前 4 位和最后 1 位。题目要求所有拆法，所以要用 mask：\nsum += (i / mask) * (i % mask);\n\n4. sum 清零位置错了\nsum 应该在每个 i 开始计算前清零，不能在判断之前清零。否则刚算完就被清成 0，永远很难等于 i。\n\n5. printf 输出变量时不要加 &\n错误：\nprintf(\"%d \", &i);\n\n&i 是变量 i 的地址，不是 i 的值。\n正确：\nprintf(\"%d \", i);\n\n这题的记忆点：\n外层枚举每个 5 位数，内层枚举每一种拆法。mask 控制“从哪里切开”，sum 负责把所有拆法的乘积加起来。", "codex": "【笔记名称】\nBC38 变种水仙花 [循环枚举]\n\n【天数】\n刷题第二天\n\n【题目】\n牛客网 BC38 变种水仙花\n\n【这题的故事】\n这题一开始方向是对的：从 10000 到 99999 枚举所有 5 位数，再把每个数按不同位置切开。但是代码里把循环条件写成了赋值，比如 i = 100000、mask = 1000；又把拆数公式写死成 i % 10 和 i / 10，只算了一种拆法。最后还在判断之前把 sum 清零，导致前面累加的结果直接没了。\n\n【核心坑点】\n- for 的中间部分是循环条件，比较要写 <= 或 ==，不能写成 =\n- 5 位数一共有 4 种切法，mask 要依次取 10、100、1000、10000\n- 左边是 i / mask，右边是 i % mask\n- sum 要在每个新数字开始前清零\n- printf 输出变量值写 i，不写 &i\n\n【一句话记忆】\nmask 是切刀，i / mask 是左半边，i % mask 是右半边。", "code": "#include <stdio.h>\n\nint main()\n{\n    int i = 0;\n    int mask = 0;\n    int sum = 0;\n\n    for (i = 10000; i <= 99999; i++) {\n        sum = 0;\n\n        for (mask = 10; mask <= 10000; mask *= 10) {\n            sum += (i / mask) * (i % mask);\n        }\n\n        if (sum == i) {\n            printf(\"%d \", i);\n        }\n    }\n\n    return 0;\n}\n", "reflection": "今天的坑：for 循环里 = 和 <= 的区别非常致命；累加器 sum 的清零位置也要看清楚，不能刚算完就清掉。\n复习点：for 循环三段式；整数除法 /；取余 %；用 mask 枚举拆分位置。", "imgs": []}, {"id": 105, "date": "刷题第一天", "title": "BC25 计算体重指数", "topics": "牛客网BC25；BMI计算；if判断；&&逻辑与；scanf格式", "summary": "【题目】牛客网 BC25：计算体重指数\n\n【目标】\n输入体重和身高，计算 BMI，并判断是否在正常范围内。\n\n【BMI公式】\nBMI = 体重 / (身高 * 身高)\n\n这里体重单位通常是 kg，身高单位通常是 m。\n\n【判断条件】\nbmi >= 18.5 && bmi <= 23.9\n\n意思是：BMI 大于等于 18.5，并且小于等于 23.9。两边都成立，整体条件才成立。\n\n【输出】\n如果 BMI 在 18.5 到 23.9 之间，输出 Normal。\n否则输出 Abnormal。", "codex": "这题主要练习三个点：scanf 输入、BMI 浮点数计算、if + && 范围判断。\n\n判断一个数是否在区间内，C语言不能直接写 18.5 <= bmi <= 23.9，应该拆成两个条件：bmi >= 18.5 && bmi <= 23.9。", "code": "#include <stdio.h>\n\nint main(void) {\n    int a;\n    float b;\n    float bmi;\n\n    scanf(\"%d %f\", &a, &b);\n\n    bmi = a / (b * b);\n\n    if (bmi >= 18.5 && bmi <= 23.9) {\n        printf(\"Normal\\n\");\n    } else {\n        printf(\"Abnormal\\n\");\n    }\n\n    return 0;\n}", "reflection": "【常见错误】\n\n1. scanf 少逗号：\n错误：scanf(\"%d %f\"&a,&b)\n正确：scanf(\"%d %f\", &a, &b);\n\n2. 语句末尾少分号：\n错误：bmi = a / (b * b)\n正确：bmi = a / (b * b);\n\n3. if 条件少小括号：\n错误：if bmi <= 23.9 && bmi >= 18.5\n正确：if (bmi <= 23.9 && bmi >= 18.5)\n\n4. else 不能写在 if 的大括号里面。\n正确结构：\nif (条件) {\n    ...\n} else {\n    ...\n}\n\n【记忆】\n&& 表示“并且”，适合判断一个数是否在某个范围内。", "imgs": []}, {"id": 103, "date": "刷题第一天", "title": "BC11", "topics": "学生基本信息输入输出；格式化输入；浮点数四舍五入", "summary": "题目：BC11 学生基本信息输入输出\n\n输入格式长这样：\n17140216;80.845,90.55,100.00\n\n要输出：\nThe each subject score of No. 17140216 is 80.85, 90.55, 100.00.\n\n这题看起来只是 scanf + printf，但真正的坑在两个地方：\n\n1. 输入格式必须完全对上\n学号和成绩之间是英文分号 ;，三个成绩之间是英文逗号 ,，所以 scanf 要写成：\nscanf(\"%d;%lf,%lf,%lf\", &num, &c, &math, &english);\n\n2. 80.845 这种小数会被浮点数近似保存\n电脑用二进制保存小数，80.845 不一定能被精确保存，可能实际存成略小一点点的数。于是 printf(\"%.2f\") 的时候，本来该进位成 80.85，却可能变成 80.84。\n\n解决办法：用 double 接收，并在输出前加一个很小的数，比如 1e-8，把二进制近似造成的极小误差补回来。\n\n这道题的记忆点：不是所有看起来简单的小数，在电脑里都是真的那个小数。遇到保留位数刚好卡在 5 的边界，要想到浮点误差。", "codex": "【笔记名称】\nBC11\n\n【天数】\n刷题第一天\n\n【题目】\n学生基本信息输入输出\n\n【这题的故事】\n一开始用 float 存成绩，样例里 21.195 输出成了 21.19；后来改成 double，又遇到 80.845 输出成 80.84。问题不在格式字符串本身，而在浮点数的二进制近似：有些十进制小数进内存以后会比原值小一点点，刚好卡在四舍五入边界时就会翻车。\n\n【核心坑点】\n- scanf 的格式要和输入完全一致：%d;%lf,%lf,%lf\n- scanf 读 double 必须用 %lf\n- printf 输出 double 仍然用 %.2f\n- 80.845、21.195 这类第三位是 5 的数，可能因为浮点误差无法按直觉进位\n\n【稳一点的写法】\n输出时给成绩加一个很小的修正值：c + 1e-8。它不会影响正常两位小数，但能补回浮点近似造成的极小偏差。\n\n【一句话记忆】\nprintf 保留两位没有错，错在浮点数进电脑以后可能已经不是你输入的那个精确小数了。", "code": "#include <stdio.h>\n\nint main()\n{\n    int num = 0;\n    double c = 0.0;\n    double math = 0.0;\n    double english = 0.0;\n\n    scanf(\"%d;%lf,%lf,%lf\", &num, &c, &math, &english);\n\n    printf(\"The each subject score of No. %d is %.2f, %.2f, %.2f.\",\n           num, c + 1e-8, math + 1e-8, english + 1e-8);\n\n    return 0;\n}\n", "reflection": "今天的坑：以为 double 就能完全解决小数四舍五入，结果 80.845 这种边界值还是会受二进制近似影响。\n复习点：scanf/printf 里 double 的格式符不同；浮点数不是精确小数。", "imgs": []}, {"id": 104, "date": "刷题第一天", "title": "秒转时分秒", "topics": "时间换算；scanf格式；printf参数；整数除法", "summary": "题目：秒转时分秒\n\n目标：输入一个总秒数，把它拆成“小时 分钟 秒”。\n\n这次代码里的错误很集中，都是 C 语言刚开始最容易踩的坑：\n\n1. scanf 的格式串忘了加双引号\n错误：\nscanf(%d, &second);\n\n正确：\nscanf(\"%d\", &second);\n\n2. 分钟的换算除数写错\n小时用 second / 3600，剩下的秒再算分钟时，应该除以 60，不是再除以 3600。\n\n错误：\nminunt = second / 3600;\n\n正确：\nminute = second / 60;\n\n3. printf 里的变量之间少逗号，还把变量名拼错了\n错误：\nprintf(\"%d %d %d\", hout minubt second);\n\n正确：\nprintf(\"%d %d %d\", hour, minute, second);\n\n4. 变量名最好别随手拼\nminunt、hout、minubt 这种拼法会让后面检查错误很痛苦。变量名不影响题目本身，但拼错以后编译器就找不到变量了。\n\n这题的记忆点：\n先用总秒数除以 3600 得到小时；把小时占掉的秒数减掉；剩下的秒数除以 60 得到分钟；最后剩下的就是秒。", "codex": "【笔记名称】\n秒转时分秒\n\n【天数】\n刷题第一天\n\n【题目】\n输入总秒数，输出小时、分钟、秒\n\n【这题的故事】\n这次不是算法难，而是小语法错误和换算公式混在一起了：scanf 的 %d 没加双引号，分钟又写成了除以 3600，最后 printf 里变量名拼错、参数之间还少了逗号。编译器会先卡在语法错误，改完以后才会暴露计算逻辑错误。\n\n【核心坑点】\n- scanf 的格式控制符必须放在字符串里：\"%d\"\n- 小时 = 总秒数 / 3600\n- 分钟 = 剩余秒数 / 60\n- printf 的每个输出变量之间要用逗号隔开\n- 变量名一旦声明为 hour，就必须一直写 hour，不能写 hout\n\n【一句话记忆】\n格式串要加引号，输出参数要加逗号，秒转分钟除以 60。", "code": "#include <stdio.h>\n\nint main()\n{\n    int second = 0;\n    int hour = 0;\n    int minute = 0;\n\n    scanf(\"%d\", &second);\n\n    hour = second / 3600;\n    second = second - hour * 3600;\n\n    minute = second / 60;\n    second = second - minute * 60;\n\n    printf(\"%d %d %d\", hour, minute, second);\n\n    return 0;\n}\n", "reflection": "今天的坑：语法错误和逻辑错误叠在一起时，要一层一层拆。先让代码能编译，再检查公式是否符合题意。\n复习点：scanf/printf 的格式写法；整数除法；秒、分钟、小时之间的单位换算。", "imgs": []}, {"id": 120, "date": "数据2", "title": "数据2之5", "topics": "2.1 线性表的定义和特点", "summary": "线性表是 n 个数据元素的有限序列，元素之间是一对一的前后关系。除第一个元素没有直接前驱、最后一个没有直接后继外，中间元素各有一个前驱和一个后继。\n\n线性表的逻辑定义与具体存储无关；代码中的 SeqList 是顺序表实现。插入时必须从后向前搬移，避免覆盖尚未搬走的数据；删除则通常从前向后覆盖空位。", "codex": "【本集定位】\n2.1 线性表的定义和特点：线性表。本集把上一阶段的概念落到可执行的 C 语言思考上。\n\n【核心讲解】\n线性表是 n 个数据元素的有限序列，元素之间是一对一的前后关系。除第一个元素没有直接前驱、最后一个没有直接后继外，中间元素各有一个前驱和一个后继。\n\n线性表的逻辑定义与具体存储无关；代码中的 SeqList 是顺序表实现。插入时必须从后向前搬移，避免覆盖尚未搬走的数据；删除则通常从前向后覆盖空位。\n\n【代码拆解】\n1. length 表示当前元素个数，不是数组容量。\n2. 插入位置允许在 0 到 length 之间。\n3. 顺序表随机访问 O(1)，中间插入/删除通常 O(n)。\n\n【易错点】\n- 越界、把 length 和 capacity 混用、搬移方向错误，都会造成数据丢失或未定义行为。\n\n【复习检查】\n1. 本集对象的输入和输出是什么？\n2. 关键循环或边界如何保证正确？\n3. 如果数据规模扩大，时间和空间如何变化？\n\n【一句话记忆】\n线性表描述顺序，数组只是它的一种实现。", "code": "#include <stdio.h>\n\n#define CAPACITY 8\ntypedef struct {\n    int data[CAPACITY];\n    int length;\n} SeqList;\n\nint insert(SeqList *list, int index, int value)\n{\n    if (index < 0 || index > list->length || list->length == CAPACITY)\n        return 0;\n    for (int i = list->length; i > index; i--)\n        list->data[i] = list->data[i - 1];\n    list->data[index] = value;\n    list->length++;\n    return 1;\n}\n\nint main(void)\n{\n    SeqList list = {{10, 20, 30}, 3};\n    insert(&list, 1, 15);\n    for (int i = 0; i < list.length; i++) printf(\"%d \", list.data[i]);\n    return 0;\n}", "reflection": "", "imgs": []}, {"id": 116, "date": "数据2", "title": "数据2之1", "topics": "1.4 算法与算法分析 1", "summary": "算法是解决特定问题的有限步骤序列。一个合格算法应有输入、输出、确定性、有限性和可行性：每一步都明确，最终一定结束，而且能用有限操作执行。程序是算法的具体实现，同一个算法可以用不同语言表达。阅读代码时先找输入、状态变化和输出，再判断循环是否必然结束。\n\n数据结构解决“数据如何组织”，算法解决“如何处理这些数据”；二者共同决定程序效率。", "codex": "【本集定位】\n1.4 算法与算法分析 1：算法的概念与特性。本集把上一阶段的概念落到可执行的 C 语言思考上。\n\n【核心讲解】\n算法是解决特定问题的有限步骤序列。一个合格算法应有输入、输出、确定性、有限性和可行性：每一步都明确，最终一定结束，而且能用有限操作执行。程序是算法的具体实现，同一个算法可以用不同语言表达。阅读代码时先找输入、状态变化和输出，再判断循环是否必然结束。\n\n数据结构解决“数据如何组织”，算法解决“如何处理这些数据”；二者共同决定程序效率。\n\n【代码拆解】\n1. 先明确问题和输入输出，再写步骤。\n2. 把复杂问题拆成可验证的小步骤。\n3. 用小规模样例手算，检查每一步状态。\n\n【易错点】\n- 不要把一段能运行的代码直接等同于好算法；还要检查是否正确、是否会终止、是否能处理边界。\n\n【复习检查】\n1. 本集对象的输入和输出是什么？\n2. 关键循环或边界如何保证正确？\n3. 如果数据规模扩大，时间和空间如何变化？\n\n【一句话记忆】\n算法 = 有限、确定、可执行的解决步骤。", "code": "#include <stdio.h>\n\nint max_of_two(int a, int b)\n{\n    return a > b ? a : b;\n}\n\nint main(void)\n{\n    printf(\"%d\\n\", max_of_two(7, 12));\n    return 0;\n}", "reflection": "", "imgs": []}, {"id": 117, "date": "数据2", "title": "数据2之2", "topics": "1.4 算法与算法分析 2", "summary": "算法分析先看正确性，再看效率。线性查找从头到尾逐个比较，最好情况一次找到，最坏情况要比较 n 次，因此时间复杂度为 O(n)，额外空间为 O(1)。\n\n复杂度描述输入规模变大时资源如何增长，不等同于某台电脑上的实际秒数。分析时关注基本操作的执行次数，并保留增长最快的项。", "codex": "【本集定位】\n1.4 算法与算法分析 2：算法正确性与复杂度。本集把上一阶段的概念落到可执行的 C 语言思考上。\n\n【核心讲解】\n算法分析先看正确性，再看效率。线性查找从头到尾逐个比较，最好情况一次找到，最坏情况要比较 n 次，因此时间复杂度为 O(n)，额外空间为 O(1)。\n\n复杂度描述输入规模变大时资源如何增长，不等同于某台电脑上的实际秒数。分析时关注基本操作的执行次数，并保留增长最快的项。\n\n【代码拆解】\n1. 确定输入规模 n。\n2. 数核心比较、赋值或循环次数。\n3. 分别考虑最好、平均和最坏情况。\n\n【易错点】\n- 不要只用一个小样例判断效率；小数据下 O(n) 和 O(n²) 可能看不出差别。\n\n【复习检查】\n1. 本集对象的输入和输出是什么？\n2. 关键循环或边界如何保证正确？\n3. 如果数据规模扩大，时间和空间如何变化？\n\n【一句话记忆】\n复杂度看增长趋势，不看一次运行的偶然时间。", "code": "#include <stdio.h>\n\nint linear_search(const int a[], int n, int target)\n{\n    for (int i = 0; i < n; i++)\n        if (a[i] == target) return i;\n    return -1;\n}\n\nint main(void)\n{\n    int a[] = {4, 8, 15, 16, 23, 42};\n    printf(\"index=%d\\n\", linear_search(a, 6, 23));\n    return 0;\n}", "reflection": "", "imgs": []}, {"id": 118, "date": "数据2", "title": "数据2之3", "topics": "1.4 算法与算法分析 3", "summary": "双重循环通常意味着乘法级增长。上面的代码输出所有不同元素对，执行次数约为 n(n-1)/2，因此是 O(n²)。如果函数只使用固定数量的临时变量，空间复杂度仍是 O(1)。\n\n时间和空间是两种资源：用额外数组换取更快查找，可能降低时间复杂度但增加空间复杂度。分析算法时要把循环、递归、临时容器和输入规模一起考虑。", "codex": "【本集定位】\n1.4 算法与算法分析 3：时间复杂度与空间复杂度。本集把上一阶段的概念落到可执行的 C 语言思考上。\n\n【核心讲解】\n双重循环通常意味着乘法级增长。上面的代码输出所有不同元素对，执行次数约为 n(n-1)/2，因此是 O(n²)。如果函数只使用固定数量的临时变量，空间复杂度仍是 O(1)。\n\n时间和空间是两种资源：用额外数组换取更快查找，可能降低时间复杂度但增加空间复杂度。分析算法时要把循环、递归、临时容器和输入规模一起考虑。\n\n【代码拆解】\n1. 单层遍历常见 O(n)，嵌套两层常见 O(n²)。\n2. 常数倍和低阶项在大 O 表示中通常省略。\n3. 额外数组、递归调用栈也属于空间开销。\n\n【易错点】\n- 不能看到两个 for 就机械判定 O(n²)，还要看内层循环实际迭代范围是否依赖 n。\n\n【复习检查】\n1. 本集对象的输入和输出是什么？\n2. 关键循环或边界如何保证正确？\n3. 如果数据规模扩大，时间和空间如何变化？\n\n【一句话记忆】\n时间看操作次数，空间看额外占用。", "code": "#include <stdio.h>\n\nvoid print_pairs(const int a[], int n)\n{\n    for (int i = 0; i < n; i++)\n        for (int j = i + 1; j < n; j++)\n            printf(\"(%d,%d) \", a[i], a[j]);\n}\n\nint main(void)\n{\n    int a[] = {1, 2, 3, 4};\n    print_pairs(a, 4);\n    return 0;\n}", "reflection": "", "imgs": []}, {"id": 119, "date": "数据2", "title": "数据2之4", "topics": "1.4 算法与算法分析 4", "summary": "算法设计常常是在正确性、时间和空间之间做权衡。二分查找每次把有序区间缩小一半，时间复杂度为 O(log n)，但前提是数据已经按升序排列，并且能够通过下标快速访问。\n\n优化不是盲目追求更复杂的算法，而是先确认瓶颈和前提条件。先写出清晰的基线版本，再比较复杂度、可维护性和实际数据规模。", "codex": "【本集定位】\n1.4 算法与算法分析 4：算法设计与性能比较。本集把上一阶段的概念落到可执行的 C 语言思考上。\n\n【核心讲解】\n算法设计常常是在正确性、时间和空间之间做权衡。二分查找每次把有序区间缩小一半，时间复杂度为 O(log n)，但前提是数据已经按升序排列，并且能够通过下标快速访问。\n\n优化不是盲目追求更复杂的算法，而是先确认瓶颈和前提条件。先写出清晰的基线版本，再比较复杂度、可维护性和实际数据规模。\n\n【代码拆解】\n1. 维护 left、right 两个边界。\n2. 每轮计算中点并排除一半区间。\n3. 循环结束时确认目标确实不存在。\n\n【易错点】\n- 二分查找最常见的错误是忘记有序前提、边界更新不正确或中点计算导致溢出。\n\n【复习检查】\n1. 本集对象的输入和输出是什么？\n2. 关键循环或边界如何保证正确？\n3. 如果数据规模扩大，时间和空间如何变化？\n\n【一句话记忆】\n更快的算法往往需要更强的前提。", "code": "#include <stdio.h>\n\nint binary_search(const int a[], int n, int target)\n{\n    int left = 0, right = n - 1;\n    while (left <= right) {\n        int mid = left + (right - left) / 2;\n        if (a[mid] == target) return mid;\n        if (a[mid] < target) left = mid + 1;\n        else right = mid - 1;\n    }\n    return -1;\n}\n\nint main(void)\n{\n    int a[] = {2, 4, 8, 16, 32, 64};\n    printf(\"index=%d\\n\", binary_search(a, 6, 32));\n    return 0;\n}", "reflection": "", "imgs": []}, {"id": 115, "date": "数据1", "title": "数据1之5", "topics": "数据1实战之复数乘除", "summary": "", "codex": "", "code": "#include <stdio.h>\n\ntypedef struct {\n    float realpart;\n    float imagpart;\n} Complex;\n\nvoid assign(Complex *A, float real, float imag)\n{\n    A->realpart = real;\n    A->imagpart = imag;\n}\n\nvoid GetReal(Complex A, float *realPart)\n{\n    *realPart = A.realpart;\n}\n\nvoid GetImag(Complex A, float *imagPart)\n{\n    *imagPart = A.imagpart;\n}\n\nvoid add(Complex A, Complex B, Complex *C)\n{\n    C->realpart = A.realpart + B.realpart;\n    C->imagpart = A.imagpart + B.imagpart;\n}\n\nvoid multiply(Complex A, Complex B, Complex *C)\n{\n    C->realpart = A.realpart * B.realpart - A.imagpart * B.imagpart;\n    C->imagpart = A.realpart * B.imagpart + A.imagpart * B.realpart;\n}\n\nint divide(Complex A, Complex B, Complex *C)\n{\n    float denominator = B.realpart * B.realpart + B.imagpart * B.imagpart;\n\n    if (denominator == 0) {\n        return 0;\n    }\n\n    C->realpart =\n        (A.realpart * B.realpart + A.imagpart * B.imagpart) / denominator;\n\n    C->imagpart =\n        (A.imagpart * B.realpart - A.realpart * B.imagpart) / denominator;\n\n    return 1;\n}\n\nvoid printComplex(Complex A)\n{\n    printf(\"%.2f + %.2fi\\n\", A.realpart, A.imagpart);\n}\n\nint main(void)\n{\n    Complex z1, z2, sum, product, result;\n    float real, imag;\n\n    assign(&z1, 8.0, 6.0);\n    assign(&z2, 4.0, 3.0);\n\n    printf(\"z1 = \");\n    printComplex(z1);\n\n    printf(\"z2 = \");\n    printComplex(z2);\n\n    GetReal(z1, &real);\n    GetImag(z1, &imag);\n\n    printf(\"z1 的实部 = %.2f\\n\", real);\n    printf(\"z1 的虚部 = %.2f\\n\", imag);\n\n    add(z1, z2, &sum);\n    printf(\"z1 + z2 = \");\n    printComplex(sum);\n\n    multiply(z1, z2, &product);\n    printf(\"z1 * z2 = \");\n    printComplex(product);\n\n    if (divide(product, sum, &result)) {\n        printf(\"(z1 * z2) / (z1 + z2) = \");\n        printComplex(result);\n    } else {\n        printf(\"除法失败\\n\");\n    }\n\n    return 0;\n}", "reflection": "", "imgs": []}, {"id": 114, "date": "数据1", "title": "数据1之4", "topics": "1.3 抽象数据类型的表示与实现", "summary": "本集主题：抽象数据类型的表示与实现。\n\nADT 的形式定义只说明数据对象、数据关系和基本操作；要让计算机真正运行，还必须选择具体语言表示存储结构，并实现每个操作。\n\n实现路线：\n1. 用 C 已有类型定义新的数据类型；\n2. 用函数实现 ADT 的基本操作；\n3. 用函数声明和头文件组织接口；\n4. 在 main 中调用这些操作完成问题。\n", "codex": "【本集定位】\n本集《1.3 抽象数据类型的表示与实现》解决一个关键问题：上一集定义出的 ADT 只是形式模型，怎样才能变成计算机中真正可运行的程序？\n\n答案是：选择具体语言和存储方式来表示数据对象，再用函数把基本操作实现出来。\n\n【一、从现实问题到可运行程序】\n数据结构课程的主线可以串起来：\n\n现实信息 → 逻辑结构 → 存储结构 → 数据运算 → 算法与程序\n\n逻辑结构描述对象之间的关系，与具体机器无关；存储结构把这种关系映射到内存；算法和程序则真正对存储的数据执行操作。\n\nADT 处在“逻辑模型”和“具体程序”之间：它先规定对象、关系和操作，再交给 C 语言完成表示与实现。\n\n【二、ADT 的表示】\n表示就是回答“数据对象在程序里怎么保存”。\n\n例如复数可以抽象为一对有顺序的实数：\n\n复数 = （实部，虚部）\n\n在 C 中可以用结构体表示：\n- real 保存实部；\n- imag 保存虚部。\n\n这里的结构体是实现手段，不是 ADT 本身。ADT 关心复数具有实部、虚部以及复数运算；结构体只是把这些内容放进内存的一种选择。\n\n【三、ADT 的实现】\nADT 的每个基本操作通常用一个函数实现：\n\n- 构造操作：接收数据项，返回一个合法的新对象；\n- 查询操作：接收对象，返回某个计算结果；\n- 修改操作：接收对象或对象指针，改变对象状态；\n- 组合操作：接收多个对象，返回新的对象。\n\n上一集的“圆”可以实现成 create、area、perimeter 函数；本集使用复数演示 make、add 和 divide 函数。\n\n【四、为什么要先声明函数】\nC 语言按源文件顺序编译。如果 main 或其他函数在调用一个函数时，编译器还没有见过它的返回类型、名字和参数列表，就可能产生隐式声明或类型不匹配问题。\n\n因此通常先写函数原型：\n\n返回类型 函数名(参数类型 参数名);\n\n声明只告诉编译器接口长什么样，函数体才是具体实现。实际项目中，声明通常放在头文件，函数实现放在 .c 文件，调用者只包含头文件即可。\n\n【五、复数加法的实现】\n设 a = ar + ai·i，b = br + bi·i，则：\n\na + b = (ar + br) + (ai + bi)·i\n\n代码中分别读取 a.real、b.real 相加，再分别读取 a.imag、b.imag 相加，最后把两个结果放入一个新的 Complex 对象返回。\n\n普通结构体变量使用点运算符：a.real、a.imag。\n\n【六、结构体指针与 ->】\n如果函数需要把结果写回调用者提供的对象，可以传入结构体指针：\n\nComplex *result\n\n此时 result 是地址，访问成员要使用 ->：\n\nresult->real\nresult->imag\n\n两种写法等价：\n\n(*result).real\nresult->real\n\n要点是：\n- 普通结构体对象使用 .；\n- 指向结构体的指针使用 ->。\n\n【七、复数除法为什么要检查零】\n复数除法的分母是：\n\nb.real² + b.imag²\n\n当 b 的实部和虚部都为 0 时，分母为 0，除法没有定义。因此函数先计算 denominator，再判断是否为 0。\n\n代码返回 0 表示失败，返回 1 表示成功；成功时通过 result 指针把商写回调用者。这是“返回状态 + 输出参数”的常见 C 语言接口设计。\n\n【八、类 C 语言与真正 C 语言】\n教材中的算法描述常使用类 C 语言。它故意省略一些与算法思想无关的语法细节，所以更简洁、更接近伪代码。\n\n类 C 语言不能直接复制到编译器运行。真正实现时必须补充：\n- 头文件；\n- 类型声明；\n- 函数返回类型和参数类型；\n- 分号、花括号和完整表达式；\n- 内存和错误处理细节。\n\n因此读算法时关注思想，写程序时再补齐语言细节。\n\n【九、代码阅读顺序】\n阅读本集示例时，建议按这个顺序：\n1. 先看 typedef struct，确定对象的内部表示；\n2. 再看函数声明，确认每个操作的输入和输出；\n3. 看函数实现，检查它是否遵守 ADT 定义；\n4. 最后看 main，观察多个操作如何组合成程序。\n\n【易错点】\n- 结构体变量用 .，结构体指针用 ->，不要混用。\n- 函数声明中的返回类型和参数类型必须与定义一致。\n- 用指针返回结果时，要确保指针指向有效对象。\n- 复数除法必须检查分母是否为 0。\n- ADT 的接口和 C 的内部结构不是同一层概念，修改实现不应破坏接口行为。\n\n【复习检查】\n1. ADT 为什么还需要“表示”和“实现”？\n2. 结构体在复数实现中扮演什么角色？\n3. 函数声明解决了什么问题？\n4. . 和 -> 的使用场景分别是什么？\n5. 为什么复数除法需要返回成功/失败状态？\n\n【一句话记忆】\nADT 先定接口和规则，C 语言再用结构体表示数据、用函数实现操作。\n", "code": "#include <stdio.h>\n\ntypedef struct {\n    double real;\n    double imag;\n} Complex;\n\nComplex complex_make(double real, double imag);\nComplex complex_add(Complex a, Complex b);\nint complex_divide(Complex a, Complex b, Complex *result);\n\nComplex complex_make(double real, double imag)\n{\n    return (Complex){real, imag};\n}\n\nComplex complex_add(Complex a, Complex b)\n{\n    return complex_make(a.real + b.real, a.imag + b.imag);\n}\n\nint complex_divide(Complex a, Complex b, Complex *result)\n{\n    double denominator = b.real * b.real + b.imag * b.imag;\n    if (denominator == 0.0) return 0;\n    result->real = (a.real * b.real + a.imag * b.imag) / denominator;\n    result->imag = (a.imag * b.real - a.real * b.imag) / denominator;\n    return 1;\n}\n\nint main(void)\n{\n    Complex a = complex_make(8.0, 6.0);\n    Complex b = complex_make(4.0, 3.0);\n    Complex sum = complex_add(a, b);\n    Complex quotient;\n    printf(\"sum=%.1f%+.1fi\\n\", sum.real, sum.imag);\n    if (complex_divide(a, b, &quotient))\n        printf(\"quotient=%.2f%+.2fi\\n\", quotient.real, quotient.imag);\n    return 0;\n}\n", "reflection": "", "imgs": []}, {"id": 113, "date": "数据1", "title": "数据1之3", "topics": "1.2 数据类型与抽象数据类型", "summary": "本集主题：数据类型、抽象数据类型（ADT）及其形式化定义。\n\n数据类型 = 一组性质相同的值 + 这组值上允许的一组操作。\n\n抽象数据类型 = 从具体问题抽象出的数据模型 + 数据关系 + 基本操作；它描述“能表示什么、能做什么”，不描述“内部如何存储”。\n\nADT 的形式通常写成三元组：\nADT 名称 {\n    数据对象；\n    数据关系；\n    基本操作；\n} ADT 名称\n", "codex": "【本集定位】\n本集《1.2 基本概念和术语 2》把上一集的“逻辑结构—存储结构—数据运算”继续抽象成两个重要概念：数据类型和抽象数据类型（ADT）。重点不是背英文缩写，而是学会把一个具体问题描述成“数据对象 + 关系 + 操作”。\n\n【一、数据类型到底规定了什么】\n在高级程序设计语言中，变量、常量、表达式、函数参数和返回值都必须有类型。类型至少隐含规定两件事：\n\n1. 取值范围：这个对象允许保存哪些值；\n2. 可进行的操作：这些值允许参与哪些运算。\n\n例如 int 不只是告诉编译器“这里放整数”，还告诉编译器应该按整数的存储方式解释它，并允许进行加、减、乘、整除和求模等整数操作。char 表示字符集合，float/double 表示近似实数，数组、结构体、联合体和指针则是在基础类型上组合出来的更复杂类型。\n\n因此，数据类型不是一个孤立的名字，而是“值的集合”和“值上的操作”的共同约定。\n\n【二、为什么需要抽象数据类型】\nC 语言自带的 int、char、double、数组和结构体足以表示很多基础数据，但复杂的数据结构往往不能直接由一个基础类型表达。例如栈、队列、线性表等，除了保存数据，还要明确入栈、出栈、插入、删除等操作。\n\n这时需要先从具体问题中抽取共同本质，忽略颜色、大小、内部布局等暂时无关的细节。这个思维过程就是抽象。\n\n抽象的结果不是某一段 C 代码，而是一个独立于具体实现的数学模型和操作规范。英文叫 Abstract Data Type，缩写为 ADT。\n\n【三、数据类型与抽象数据类型的区别】\n数据类型更接近语言和编译器：它通常涉及存储大小、取值范围、表达式规则和底层实现。\n\n抽象数据类型更接近问题建模：它只关心对象的意义、对象之间的关系，以及外部允许调用的操作；它不要求现在就决定使用数组、链表还是其他存储方式。\n\n可以这样记：\n- 数据类型回答“这个值是什么类型，能做哪些运算”；\n- ADT 回答“这个抽象对象是什么，外部能对它做什么”。\n\n【四、ADT 的三个组成部分】\n一个抽象数据类型至少包含：\n\n1. 数据对象\n说明这个抽象类型的对象由哪些数据构成。\n\n2. 数据关系\n说明对象内部各部分之间必须满足什么逻辑关系。\n\n3. 基本操作\n说明允许对数据对象做哪些操作，以及操作的输入、前提和结果。\n\n形式化地说，可以把 ADT 看成三元组：\n\nADT = （数据对象，数据关系，基本操作）\n\n它是一份接口和规则说明，而不是内部实现。\n\n【五、基本操作的描述格式】\n每个操作要交代四件事：\n\n- 操作名：调用这个操作时使用什么名字；\n- 参数表：需要哪些输入；\n- 初始条件：操作开始前，数据和参数必须满足什么条件；\n- 操作结果：操作成功后返回什么，或数据结构发生什么变化。\n\n初始条件为空时可以省略。若条件不满足，应返回错误信息或规定的失败结果。\n\n参数还可以分为普通输入参数和引用型参数。引用型参数通过地址让操作把结果带回调用者，这对应 C 语言中常见的指针参数。\n\n【六、例子：把圆抽象成 ADT】\n圆的本质属性可以用半径 r 和圆心坐标（x，y）表示。圆的颜色、画在纸上还是屏幕上、线条粗细，都不是这个抽象模型的必要部分。\n\n圆的基本操作可以设计为：\n\n- Create(r, x, y)：根据半径和圆心创建一个圆，结果是新圆对象；\n- Area(c)：前提是圆 c 已存在，结果是 πr²；\n- Perimeter(c)：前提是圆 c 已存在，结果是 2πr；\n- Scale(c, n)：根据缩放比例生成缩放后的圆。\n\n这里的重点是操作契约：调用者只需要知道“传入什么、得到什么”，不需要先知道圆对象在内存中是结构体、数组还是其他表示。\n\n【七、例子：复数 ADT】\n复数可以抽象成一对有顺序的实数（实部，虚部）。实部和虚部的顺序不能交换，因为（a，b）与（b，a）通常表示不同的复数。\n\n复数的操作可以包括：\n- 创建复数；\n- 复数加法；\n- 复数减法；\n- 复数乘法；\n- 复数除法；\n- 取实部和虚部。\n\nADT 先规定这些对象和操作的数学含义，至于最终用两个 double、一个结构体，还是其他方式实现，可以留到后续设计阶段。\n\n【八、代码如何体现“抽象”和“实现分离”】\n代码区用 Circle 结构体保存半径和圆心，用 circle_create、circle_area、circle_perimeter 表示外部操作。\n\n从 ADT 角度看：\n- Circle 是数据对象的一个具体实现；\n- radius、x、y 体现数据关系和约束；\n- 三个函数是对外提供的基本操作；\n- main 只调用操作，不重复计算面积公式。\n\n如果以后把 Circle 改成指针、动态内存或隐藏结构体，只要操作名和行为保持一致，调用者的使用方式就可以基本不变。这正是抽象数据类型带来的好处。\n\n【九、易错点】\n- ADT 不是某种固定的 C 语法，而是一种建模和接口描述方法。\n- 数据类型要考虑取值范围和允许操作，ADT 还要考虑对象关系和操作契约。\n- 形式定义不能只写数据对象，还必须写关系和基本操作。\n- 先写清楚操作的初始条件，再写代码，能减少非法输入和未定义行为。\n- “能实现”不等于“抽象得好”：好的 ADT 应隐藏不必要的存储细节。\n\n【复习检查】\n1. 数据类型由哪两部分共同构成？\n2. ADT 为什么可以不考虑内部存储？\n3. ADT 三元组分别是什么？\n4. 一个基本操作需要描述哪些内容？\n5. 如何把圆或复数写成“数据对象 + 关系 + 操作”？\n\n【一句话记忆】\n数据类型规定值和运算，ADT 规定对象、关系和操作；先定义“能做什么”，再决定“内部怎么做”。\n", "code": "#include <stdio.h>\n\ntypedef struct {\n    double radius;\n    double x;\n    double y;\n} Circle;\n\nCircle circle_create(double radius, double x, double y)\n{\n    return (Circle){radius, x, y};\n}\n\ndouble circle_area(Circle c)\n{\n    const double pi = 3.141592653589793;\n    return pi * c.radius * c.radius;\n}\n\ndouble circle_perimeter(Circle c)\n{\n    const double pi = 3.141592653589793;\n    return 2.0 * pi * c.radius;\n}\n\nint main(void)\n{\n    Circle c = circle_create(2.0, 0.0, 0.0);\n    printf(\"area=%.2f perimeter=%.2f\\n\",\n           circle_area(c), circle_perimeter(c));\n    return 0;\n}\n", "reflection": "", "imgs": []}, {"id": 112, "date": "数据1", "title": "数据1之2", "topics": "1.2 基本概念和术语 1", "summary": "本集主题：数据、数据元素、数据项、数据对象，以及数据结构的逻辑结构与存储结构。\n\n核心层级：\n数据 → 数据元素 → 数据项\n数据对象 = 性质相同的数据元素的集合\n\n数据结构包含三个方面：\n1. 逻辑结构：数据元素之间是什么关系；\n2. 存储结构：数据元素和关系如何放进计算机内存；\n3. 数据运算：对这些数据可以做什么，以及如何实现这些操作。\n", "codex": "【本集定位】\n本集《1.2 基本概念和术语 1》是在上一集“对象—关系—操作”的基础上，把数据结构课程里最容易混淆的名词逐个分层，并开始说明同一种逻辑关系可以怎样存进计算机。\n\n【一、数据：计算机能够处理的符号集合】\n现实中的信息必须先被抽象成计算机可以识别、存储和加工的符号，这些符号的集合就是数据。数据是信息的载体，是对客观事物的符号化表示。\n\n按照是否能直接进行算术运算，可以粗略分为：\n- 数值数据：整数、实数等，可以进行加减乘除、平方、开方等运算；\n- 非数值数据：文字、图形、图像、声音等，重点通常是存储、比较、检索、编辑和组织。\n\n注意：非数值数据并不是“不能被计算机处理”，而是处理方式不主要表现为算术运算。例如姓名可以查找和排序，图片可以压缩，声音可以采样。\n\n【二、数据元素：作为整体处理的基本单位】\n如果一组数据在程序中总是作为一个整体被处理，它就是一个数据元素。\n\n以学生表为例，一名学生的一整条记录可以包含学号、姓名、性别、出生日期、政治面貌等信息。当学生转学时，通常删除整条记录；新生入学时，通常加入整条记录。这个“完整的一条学生记录”就是一个数据元素。\n\n数据元素在不同语境中还可能叫：\n- 元素；\n- 记录；\n- 结点；\n- 顶点。\n\n它们强调的侧重点不同，但都可以指组成数据的基本单位：记录强调表格，结点强调链接关系，顶点强调图结构。\n\n【三、数据项：组成数据元素的最小单位】\n一个数据元素还可以继续拆分。构成数据元素、通常不可再分的最小单位，叫数据项。\n\n学生记录是数据元素，学号、姓名、性别、出生日期和政治面貌就是其中的数据项。\n\n层级关系要牢记：\n数据由许多数据元素组成；\n一个数据元素由若干数据项组成。\n\n可以类比为：学生信息表是“数据”，一行学生记录是“数据元素”，这一行中的姓名或成绩字段是“数据项”。\n\n【四、数据对象：性质相同的数据元素的集合】\n数据对象不是一个单独元素，而是性质相同的数据元素构成的集合。\n\n例子：\n- 所有整数构成整数数据对象；\n- 所有大写字母构成一个数据对象；\n- 学生表中所有学生记录构成学生数据对象。\n\n数据元素和数据对象的区别：\n- 数据元素是集合中的一个个体，强调“单条记录”；\n- 数据对象是性质相同的许多个数据元素形成的集合，强调“整体范围”。\n\n【五、数据结构的严格含义】\n数据元素并不是孤立存在的。元素之间总会有某种关系，例如前后关系、上下级关系、连接关系等。\n\n数据结构可以理解为：相互之间存在一种或多种特定关系的数据元素集合。\n\n这一定义包含三部分：\n1. 逻辑结构：元素之间的逻辑关系，与怎样存储无关；\n2. 存储结构：元素及其关系在计算机内存中的表示方式；\n3. 数据运算：可以对这些元素执行的操作，以及这些操作在存储结构上的实现。\n\n逻辑结构是抽象，回答“它们之间是什么关系”；存储结构是实现，回答“这些关系在内存里怎样落地”。\n\n【六、逻辑结构的第一种划分：线性与非线性】\n线性结构是一对一的关系：有且只有一个开始结点和一个终端结点，除首尾外的结点最多有一个直接前驱和一个直接后继。线性表、栈、队列和串都属于线性结构。\n\n非线性结构不是简单的一对一关系，常见有：\n- 一对多：树；\n- 多对多：图。\n\n井字棋的一个棋局可以派生多个下一局，体现一对多；地图中一个地点可能连接多个地点，而且多个地点之间可以互相连接，体现多对多。\n\n【七、逻辑结构的第二种划分：四类】\n教材还常把逻辑结构分成四类：\n\n1. 集合：除了“同属于一个集合”外，没有其他关系；\n2. 线性结构：数据元素之间是一对一关系；\n3. 树形结构：数据元素之间是一对多的层次关系；\n4. 图结构：数据元素之间是多对多的网状关系。\n\n这两种划分并不矛盾：第一种强调线性/非线性的总区别，第二种进一步把非线性拆成树和图，并把“集合”单列出来。\n\n【八、顺序存储结构】\n顺序存储使用一片连续的内存单元，按照元素的逻辑顺序依次存放数据。\n\n在线性表中，前后关系可以直接由内存位置表达：前面的元素放在较前位置，后面的元素放在较后位置。C 语言数组就是典型的顺序存储工具。\n\n优点：\n- 能通过下标快速访问；\n- 内存连续，结构直观；\n- 对遍历和随机访问友好。\n\n代价：\n- 中间插入或删除可能需要搬动大量元素；\n- 需要提前规划容量；\n- 连续空间不足时扩容可能要重新分配。\n\n【九、链式存储结构】\n链式存储不要求所有元素占用连续内存。每个结点除了保存自身数据，还保存后继结点的地址，地址在 C 语言中通常用指针表示。\n\n链表的结点可以分散在内存各处，但从头结点开始，沿着 next 指针就能找到后继。最后一个结点的 next 为空，表示链表结束。\n\n优点：\n- 插入和删除时主要修改指针连接；\n- 不要求一大片连续内存；\n- 结构规模可以动态变化。\n\n代价：\n- 访问第 n 个元素需要从头逐个寻找；\n- 每个结点要额外保存指针；\n- 指针错误会导致断链、野指针或内存泄漏。\n\n【十、代码对应关系】\n代码区用同一组 Student 数据同时展示两种存储：\n- students 数组是顺序表，数组下标表达元素位置；\n- Node 的 next 是链式关系，指针表达后继位置；\n- p = p->next 表示沿链访问下一个结点；\n- NULL 表示没有后继，是链表结束标志。\n\n这说明逻辑关系和存储方式可以分开思考：同样的“前后顺序”，既可以用连续位置实现，也可以用指针链接实现。\n\n【易错点】\n- 不要把“数据元素”和“数据对象”混为一谈：前者是个体，后者是同类个体的集合。\n- 不要把逻辑结构和存储结构混为一谈：线性关系不等于必须用数组实现。\n- 链表访问必须从有效头指针开始，并在解引用前确认指针不为 NULL。\n- 顺序表容量、当前长度和下标范围是三个不同概念。\n\n【复习检查】\n1. 学生表、学生的一行记录、这一行中的姓名分别属于哪个层次？\n2. 数据对象和数据元素的关系是什么？\n3. 数据结构包括哪三个方面？\n4. 线性结构、树形结构、图结构的关系分别是什么？\n5. 顺序存储如何表达前后关系？链式存储又如何表达？\n\n【一句话记忆】\n数据是总集合，数据元素是一个整体，数据项是最小字段；数据结构再进一步研究这些元素的关系、存法和操作。\n", "code": "#include <stdio.h>\n\n/* 一个数据元素：一条完整的学生记录 */\ntypedef struct {\n    int id;             // 数据项：学号\n    char name[20];      // 数据项：姓名\n    int score;          // 数据项：成绩\n} Student;\n\n/* 顺序存储：元素在连续数组中，位置表达前后关系 */\nStudent students[] = {\n    {1001, \"Li\", 90},\n    {1002, \"Wang\", 86},\n    {1003, \"Zhao\", 95}\n};\n\n/* 链式存储：结点中保存下一个结点的地址 */\ntypedef struct Node {\n    Student data;       // 当前数据元素\n    struct Node *next;  // 后继元素的地址\n} Node;\n\nint main(void)\n{\n    size_t count = sizeof(students) / sizeof(students[0]);\n    printf(\"顺序表有 %zu 个数据元素\\n\", count);\n    printf(\"第一个元素：%s，%d分\\n\",\n           students[0].name, students[0].score);\n\n    Node third = {students[2], NULL};\n    Node second = {students[1], &third};\n    Node first = {students[0], &second};\n\n    for (Node *p = &first; p != NULL; p = p->next)\n        printf(\"链表结点：%s\\n\", p->data.name);\n    return 0;\n}\n", "reflection": "", "imgs": []}, {"id": 111, "date": "数据1", "title": "数据1之1", "topics": "1.1 数据结构的研究内容", "summary": "本集主线：数据结构研究的不是孤立的数据，而是计算机操作对象、对象之间的关系，以及施加在这些对象上的操作。\n\n计算机解决问题的一般过程：\n1. 从现实问题中抽象出数学模型；\n2. 针对模型设计算法；\n3. 用程序设计语言实现、调试并运行。\n\n本集通过四类问题引出三种典型结构：\n- 信息管理系统 → 有前后次序的线性表；\n- 井字棋的派生棋局 → 树；\n- 磁盘目录 → 树；\n- 地图导航 → 图。\n", "codex": "【课程定位】\n视频第 2 集《第01周b—1.1 数据结构研究》回答的是一个根本问题：为什么学习数据结构，以及数据结构究竟研究什么。\n\n这一集暂时没有急着讲数组、链表或具体算法，而是先建立一套观察问题的方法：面对一个现实问题，先找出计算机真正要操作的对象，再找出这些对象之间的关系，最后明确要对它们执行哪些操作。\n\n【一、计算机解决问题的完整过程】\n老师把过程分成三步：\n\n1. 抽象数学模型\n从现实问题中排除无关细节，只保留计算机能够表示和操作的对象，以及对象之间的关系。\n\n2. 设计算法\n数学模型确定以后，再设计解决问题的步骤。算法回答“怎样一步一步得到结果”。\n\n3. 编程、调试与运行\n选择一种程序设计语言，把算法写成程序，上机调试，直到程序能够正确运行。\n\n可以把这三步记成：\n现实问题 → 数据模型 → 算法 → 程序\n\n许多初学者一看到题目就马上写代码，容易卡住。真正应该先问的是：\n- 我要处理的对象是什么？\n- 对象之间有什么关系？\n- 我要执行哪些操作？\n\n【二、什么叫“抽象出数学模型”】\n抽象并不是把问题变得更复杂，而是删去现实世界中暂时不重要的细节，只留下计算机需要处理的部分。\n\n具体过程是：\n1. 分析现实问题；\n2. 找出计算机可以操作的对象；\n3. 分析对象之间的关系；\n4. 用合适的数学或逻辑形式描述对象和关系。\n\n对象加上对象之间的关系，就形成了这一集所强调的数据结构。\n\n【三、早期重点：数值计算】\n早期计算机主要用于数值计算，例如求解工程中的线性方程组、预测人口增长等。\n\n这类问题通常具有两个特点：\n- 操作对象之间的关系比较容易用方程描述；\n- 真正困难的是计算量很大。\n\n例如矩阵和向量可以用数组保存，之后由计算机快速完成大量运算。此时研究重点更多是数值计算方法。\n\n【四、现代重点：非数值计算】\n随着计算机应用范围扩大，大量问题不再以“求一个数”为目标，而是处理各种信息。\n\n例如学生信息系统中会保存：\n- 学号、姓名、性别、籍贯和专业；\n- 课程名称、成绩等记录。\n\n对这些信息最常见的操作不是加减乘除，而是：\n- 增：加入一条新记录；\n- 删：删除离校或无效记录；\n- 查：按学号或姓名查找；\n- 改：修改姓名、成绩或其他字段。\n\n这就是常说的“增删查改”。非数值计算的关键不再是复杂算式，而是如何组织对象，使这些操作更清楚、更高效。\n\n【五、例子一：信息管理系统为什么是线性表】\n学生、图书、员工、仓库物品和联系人等记录，通常一条接一条地排列。\n\n这种关系具有明显的前后次序：\n- 第一条记录没有前驱；\n- 最后一条记录没有后继；\n- 中间记录通常各有一个前驱和一个后继。\n\n这种一对一的前后关系叫线性关系，由此抽象出的结构就是线性表。\n\n线性表关心的不是某一条记录具体叫李明还是王芳，而是记录如何排列，以及怎样插入、删除、查找和修改。\n\n【六、例子二：井字棋为什么形成树】\n在井字棋中，一个当前棋局可能有多个空位置，因此下一步可能产生多个不同棋局，这些叫派生棋局。\n\n选择其中一个派生棋局以后，它又能继续派生出下一层的多个棋局。于是：\n- 当前棋局像根；\n- 每一种下一步像一个分支；\n- 分支还可以继续产生分支。\n\n这种“一对多、逐层派生”的关系像一棵倒置的树，是典型的非线性结构。\n\n在这个模型里：\n- 操作对象是每一个棋局状态；\n- 对象关系是“由哪个棋局派生而来”；\n- 主要操作是按照决策策略选择下一个棋局。\n\n【七、例子三：磁盘目录为什么也是树】\n磁盘中一个目录可以包含多个子目录和文件；每个子目录通常只属于一个上级目录。\n\n它同样是一对多的层次关系：\n- 磁盘或根目录是根；\n- 文件夹是中间节点；\n- 文件通常是末端节点。\n\n井字棋与目录系统的现实含义完全不同，但它们都能抽象为树。这正说明数据结构研究的是关系形式，而不是对象表面的名称。\n\n【八、例子四：地图导航为什么是图】\n地图导航需要把现实地图抽象成计算机可以计算的模型：\n- 地点、路口或车站看成点，也叫顶点；\n- 道路看成点与点之间的连线，也叫边；\n- 距离、时间或费用可以作为边的权值。\n\n地点之间可能互相连接，形成网状关系。这种多对多关系不能简单表示成线性表，也不一定具有树的上下级关系，因此使用图来表示。\n\n导航程序随后可以在图上研究：\n- 两个地点是否连通；\n- 可以经过哪些路线；\n- 哪条路线距离最短；\n- 哪条路线耗时最少。\n\n【九、三种结构的对比】\n线性表：一对一的前后关系。\n例子：学生名单、图书记录、联系人列表。\n\n树：一对多的层次关系。\n例子：棋局派生、磁盘目录、组织结构。\n\n图：多对多的网状关系。\n例子：道路网络、地铁网络、社交关系。\n\n判断结构时不要只看对象是什么，而要看对象怎样发生联系。\n\n【十、数据结构研究什么】\n本集最后把研究对象落在三个方面：\n\n1. 计算机要操作的数据对象\n例如学生记录、棋局状态、文件目录、地图地点。\n\n2. 数据对象之间的关系\n例如线性关系、层次关系和网状关系。\n\n3. 施加在这些对象上的操作\n例如插入、删除、查找、修改、选择下一状态和寻找最短路径。\n\n因此可以用一句话概括：\n数据结构研究非数值计算问题中，操作对象、对象之间的逻辑关系，以及对这些对象所进行的操作。\n\n【C 语言建模提示】\n代码区给出了三个概念模型：\n- Student 数组演示线性表中的顺序记录；\n- GameState 的 children 演示一个棋局派生多个子棋局；\n- MapGraph 的邻接矩阵演示地点之间的距离关系。\n\n这段代码的目的不是实现完整的数据结构，而是让你看到同一个现实问题如何逐渐变成 C 语言中的结构体、数组、指针和矩阵。\n\n【学习检查】\n学完本集后，应该能回答：\n1. 计算机解决现实问题通常经过哪三个阶段？\n2. 抽象数学模型时必须找出哪两样东西？\n3. 为什么学生信息管理适合抽象成线性表？\n4. 为什么井字棋和目录系统都可以抽象成树？\n5. 地图中的点、边和权值分别表示什么？\n6. 数据结构最终研究哪三个方面？\n\n【一句话记忆】\n先找对象，再看关系，最后确定操作；对象和关系的组织方式，就是数据结构研究的核心。\n", "code": "#include <stdio.h>\n\n/* 1. 线性表：学生记录按顺序排列 */\ntypedef struct {\n    int id;\n    char name[20];\n    int score;\n} Student;\n\n/* 2. 树：一个棋局可以派生出多个下一步棋局 */\ntypedef struct GameState {\n    int board[3][3];\n    struct GameState *children[9];\n    int child_count;\n} GameState;\n\n/* 3. 图：地点是顶点，道路是边，权值可以表示距离或时间 */\n#define CITY_COUNT 4\n\ntypedef struct {\n    const char *name[CITY_COUNT];\n    int distance[CITY_COUNT][CITY_COUNT];\n} MapGraph;\n\nint main(void)\n{\n    Student students[] = {\n        {1001, \"Li\", 90},\n        {1002, \"Wang\", 86},\n        {1003, \"Zhao\", 95}\n    };\n\n    MapGraph map = {\n        {\"学校\", \"地铁站\", \"商场\", \"广场\"},\n        {\n            {0, 5, 12, 20},\n            {5, 0, 6, 10},\n            {12, 6, 0, 4},\n            {20, 10, 4, 0}\n        }\n    };\n\n    printf(\"线性表第一条记录：%s，%d分\\n\",\n           students[0].name, students[0].score);\n    printf(\"从%s到%s的直接距离：%d\\n\",\n           map.name[0], map.name[3], map.distance[0][3]);\n\n    return 0;\n}\n", "reflection": "", "imgs": []}]</script>
<script>

const DATA = JSON.parse(document.getElementById('notes-data').textContent);
const listEl = document.getElementById('list');
const searchEl = document.getElementById('search');
let currentId=null, filtered=DATA.slice();
function rlabel(n){let l=(n.date||'')+'  '+(n.title||'');if(n.topics&&n.topics.trim())l+='  ['+n.topics.trim()+']';return l;}
function renderList(){
  listEl.innerHTML='';
  filtered.forEach(function(n){
    const div=document.createElement('div');
    div.className='note-item'+(n.id===currentId?' active':'');
    const dd=document.createElement('span');dd.className='d';dd.textContent=(n.date||'')+' · '+(n.topics||'');
    div.appendChild(document.createTextNode((n.date||'')+'  '+(n.title||'')));
    div.appendChild(document.createElement('br'));
    div.appendChild(dd);
    div.dataset.id=n.id;
    div.addEventListener('click',function(){selectNote(n.id);});
    listEl.appendChild(div);
  });
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderCode(code){
  const el=document.getElementById('p-code'); el.textContent='';
  const re=/(\/\/.*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\])*")|(^\s*#.*$)|(\b(?:0x[0-9A-Fa-f]+|\d+(?:\.\d+)?)\b)|(\b[A-Za-z_]\w*(?=\s*\())|(\b(?:auto|break|case|char|const|continue|default|do|double|else|enum|extern|float|for|goto|if|inline|int|long|register|restrict|return|short|signed|sizeof|static|struct|switch|typedef|union|unsigned|void|volatile|while)\b)/gm;
  let out='',last=0,m;
  while((m=re.exec(code))!==null){
    out+=esc(code.slice(last,m.index));
    if(m[1])out+='<span class="cm">'+esc(m[1])+'</span>';
    else if(m[2])out+='<span class="st">'+esc(m[2])+'</span>';
    else if(m[3])out+='<span class="pp">'+esc(m[3])+'</span>';
    else if(m[4])out+='<span class="nb">'+esc(m[4])+'</span>';
    else if(m[5])out+='<span class="fn">'+esc(m[5])+'</span>';
    else if(m[6])out+='<span class="kw">'+esc(m[6])+'</span>';
    last=re.lastIndex;
  }
  out+=esc(code.slice(last)); el.innerHTML=out;
}
function renderImages(imgs){
  const holder=document.getElementById('p-summary');
  holder.textContent=(DATA.find(function(x){return x.id===currentId;})||{}).summary||'';
  imgs.forEach(function(it){
    const img=document.createElement('img');
    img.className='thumb'; img.loading='lazy'; img.src=it.u; img.alt=it.n;
    img.addEventListener('click',function(){openViewer(it.u,it.n);});
    holder.appendChild(img); holder.appendChild(document.createTextNode('\n'));
  });
}
function openViewer(u,name){document.getElementById('viewer-img').src=u;document.getElementById('viewer-name').textContent=name||'';document.getElementById('viewer').classList.add('show');}
function closeViewer(){document.getElementById('viewer').classList.remove('show');}
function selectNote(id){
  const n=DATA.find(function(x){return x.id===id;}); if(!n)return;
  currentId=id;
  document.getElementById('f-date').value=n.date||'';
  document.getElementById('f-title').value=n.title||'';
  document.getElementById('f-topics').value=n.topics||'';
  document.getElementById('m-detail-title').textContent=n.title||'';
  document.getElementById('p-summary').textContent=n.summary||'';
  document.getElementById('p-codex').textContent=n.codex||'';
  document.getElementById('p-reflection').textContent=n.reflection||'';
  document.getElementById('p-input').textContent='';
  renderCode(n.code||''); renderImages(n.imgs||[]);
  document.getElementById('status').textContent='共 '+DATA.length+' 篇笔记 · 当前：'+(n.title||'');
  renderList();
  // On mobile, switch to detail view
  if(window.innerWidth<=860){ document.body.className='mview-detail'; }
  switchTab('tab-codex');
}
function switchTab(id){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  document.getElementById(id).classList.add('active');
  ['p-summary','p-codex','p-reflection','p-input'].forEach(function(p){document.getElementById(p).classList.remove('active');});
  const map={'tab-summary':'p-summary','tab-codex':'p-codex','tab-reflection':'p-reflection','tab-input':'p-input'};
  document.getElementById(map[id]).classList.add('active');
}
function showList(){ document.body.className='mview-list'; }
searchEl.addEventListener('input',function(){
  const q=searchEl.value.trim().toLowerCase();
  filtered=q?DATA.filter(function(n){return (n.date+' '+n.title+' '+n.topics+' '+n.summary+' '+n.codex+' '+n.code+' '+n.reflection).toLowerCase().indexOf(q)>=0;}):DATA.slice();
  renderList();
});
document.getElementById('viewer').addEventListener('click',closeViewer);
document.addEventListener('DOMContentLoaded',function(){
  if(window.innerWidth<=860){ document.body.className='mview-list'; }
  fallbackIfMobile();
  if(DATA.length){ renderList(); } else { document.getElementById('status').textContent='暂无笔记'; }
});
window.addEventListener('resize',fallbackIfMobile);
function fallbackIfMobile(){
  // on desktop always show main; ensure not stuck in list view
  if(window.innerWidth>860 && document.body.className.indexOf('mview')>=0){ document.body.className='mview-detail'; }
}

</script>
</body>
</html>
