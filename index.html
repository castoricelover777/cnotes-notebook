<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CNotes - C 语言学习笔记</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font-family:'Microsoft YaHei UI','Microsoft YaHei',system-ui,sans-serif;background:#f5f7fb;color:#17202a;font-size:14px}
#app{display:flex;height:100vh;min-height:0}
.sidebar{width:300px;min-width:240px;background:#f6f7f9;padding:14px;display:flex;flex-direction:column;flex:none;border-right:1px solid #e3e7ee}
.sidebar .brand{font-size:18px;font-weight:bold;color:#1d2733}
.sidebar .hint{font-size:12px;color:#6a7483;margin:2px 0 12px}
.sidebar input[type=text]{width:100%;padding:8px 10px;border:1px solid #d5dae3;border-radius:6px;font-family:inherit;font-size:14px}
.list-wrap{flex:1;margin:12px 0;overflow-y:auto;background:#f6f7f9}
.note-item{padding:11px 12px;border-radius:6px;margin-bottom:3px;cursor:pointer;font-size:14px;color:#1d2733;background:#ffffff;border:1px solid #e6e9ef}
.note-item:hover{background:#eceae6}
.note-item.active{background:#2d6cdf;color:#ffffff;border-color:#2d6cdf}
.note-item .d{font-size:11px;opacity:.65;display:block}
.btnrow{display:flex;gap:6px;margin:0 0 8px}
.btn{flex:1;padding:8px 0;border:1px solid #cfd6e0;border-radius:6px;background:#ffffff;cursor:pointer;font-family:inherit;font-size:13px;color:#1d2733}
.btn:hover{background:#f0f3f8}
.btn.full{width:100%;margin-top:6px}
.tip{font-size:12px;color:#6a7483;line-height:1.6;margin-top:12px}
.main{flex:1;display:flex;min-width:0}
.workspace{flex:1;display:flex;min-width:0;flex-direction:column}
.editor{flex:1;background:#ffffff;padding:14px;display:flex;flex-direction:column;min-width:0;min-height:0}
.meta{display:flex;gap:10px;margin-bottom:14px}
.meta label{font-size:12px;color:#4b5565;display:block;margin-bottom:3px}
.meta input{width:100%;padding:7px 9px;border:1px solid #dce1ea;border-radius:6px;font-family:inherit;font-size:14px}
.meta .f{flex:1}.meta .f.date{flex:0 0 130px}.meta .f.title{flex:2}.meta .f.topics{flex:1}
.toolbar{display:flex;gap:8px;margin-bottom:12px}
.tabs{display:flex;border-bottom:2px solid #e6e9ef;margin-top:2px;overflow-x:auto}
.tab{padding:10px 16px;font-size:14px;font-weight:bold;color:#5b6b82;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab.active{color:#175cd3;border-bottom-color:#175cd3}
.panelwrap{flex:1;display:none;flex-direction:column;min-height:0}
.panelwrap.active{display:flex}
.textholder{flex:1;overflow-y:auto;background:#fbfcfe;border:1px solid #dce1ea;border-radius:0 0 6px 6px;padding:14px;font-size:14.5px;color:#17202a;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.textholder.mono{font-family:'Cascadia Code',Consolas,Menlo,monospace;font-size:13px;background:#101826;color:#d8e2f2;white-space:pre;overflow:auto}
.panel img.thumb{max-width:100%;height:auto;display:block;margin:10px auto;border:1px solid #e6e9ef;cursor:zoom-in;border-radius:6px}
.kw{color:#7dd3fc}.st{color:#86efac}.cm{color:#8b9bb3}.pp{color:#fbbf24}.nb{color:#fca5a5}.fn{color:#c4b5fd}
.codebox{background:#eef4ff;padding:7px 10px;border-radius:6px 6px 0 0;display:flex;justify-content:space-between;align-items:center}
.codebox .t{font-size:13px;font-weight:bold;color:#173b72}.codebox .s{font-size:12px;color:#5b6b82}
.statusbar{background:#eef1f5;color:#415065;padding:5px 10px;font-size:12px;border-top:1px solid #e0e4ea}
#viewer{position:fixed;inset:0;background:rgba(17,24,39,.93);display:none;align-items:center;justify-content:center;z-index:9999;flex-direction:column}
#viewer.show{display:flex}
#viewer img{max-width:96vw;max-height:84vh;background:#111827;border-radius:4px}
#viewer .vfoot{color:#e5e7eb;padding:10px;display:flex;justify-content:space-between;width:96vw}
#viewer .vfoot button{background:#eef1f5;border:none;padding:6px 16px;border-radius:6px;cursor:pointer}
/* ---- mobile: list -> detail ---- */
.mobile-only{display:none}
@media (max-width:860px){
  body{overflow:hidden}
  #app{flex-direction:column}
  .sidebar{width:100%;min-width:0;height:100vh;border-right:none}
  /* 手机端：隐藏只读分享版用不到的编辑按钮，把空间全部让给笔记列表 */
  .btnrow,.btn.full,.tip{display:none}
  .list-wrap{flex:1;margin:10px 0 0;overflow-y:auto}
  .note-item{padding:12px 14px;font-size:14px}
  .main,.workspace{flex-direction:column}
  .editor{flex:1;min-height:0}
  /* toggle views */
  body.mview-list .sidebar{display:flex}
  body.mview-list .main{display:none}
  body.mview-detail .sidebar{display:none}
  body.mview-detail .main{display:flex}
  .mobile-only{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#175cd3;color:#fff;font-size:15px;font-weight:bold}
  .mobile-only .back{background:rgba(255,255,255,.18);border:none;color:#fff;padding:7px 14px;border-radius:8px;font-size:14px;cursor:pointer}
  .mobile-only .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
</style>
</head>
<body>
<div id="app">
  <div class="sidebar">
    <div class="brand">每日 C 笔记</div>
    <div class="hint">按日期、标题、知识点或代码搜索</div>
    <input id="search" type="text" placeholder="搜索笔记...">
    <div class="list-wrap" id="list"></div>
    <div class="btnrow">
      <button class="btn" onclick="alert('分享版为只读，本机应用可使用“新建今天”')">新建今天</button>
      <button class="btn" onclick="location.reload()">刷新</button>
      <button class="btn" onclick="alert('分享版为只读，删除请在本机应用操作')">删除</button>

    <button class="btn full" onclick="alert('分享版为只读，导出请在本地应用中操作')">导出 Markdown</button>
    <div class="tip">建议节奏：每天一段代码 + 一个困惑 + 一个复盘。</div>

  <div class="main">
    <div class="workspace">
      <div class="mobile-only"><button class="back" onclick="showList()">‹ 列表</button><span class="t" id="m-detail-title">笔记</span></div>
      <div class="editor">
        <div class="meta">
          <div class="f date"><label>日期</label><input id="f-date" readonly></div>
          <div class="f title"><label>标题</label><input id="f-title" readonly></div>
          <div class="f topics"><label>知识点标签</label><input id="f-topics" readonly></div>
        </div>
        <div class="toolbar">
          <button class="btn" style="flex:0 0 auto;padding:7px 16px" onclick="alert('保存 Ctrl+S 请在本机应用使用')">保存 Ctrl+S</button>
          <button class="btn" style="flex:0 0 auto;padding:7px 16px" onclick="alert('编译运行 F5 请在本机应用使用')">编译运行 F5</button>
          <button class="btn" style="flex:0 0 auto;padding:7px 16px" onclick="alert('添加图片请在本机应用使用')">添加图片</button>
        </div>
        <div class="tabs">
          <div class="tab" id="tab-summary" onclick="switchTab('tab-summary')">课堂笔记</div>
          <div class="tab active" id="tab-codex" onclick="switchTab('tab-codex')">翁凯课总结</div>
          <div class="tab" id="tab-reflection" onclick="switchTab('tab-reflection')">复盘</div>
          <div class="tab" id="tab-input" onclick="switchTab('tab-input')">程序输入</div>
        </div>
        <div class="panelwrap textholder" id="p-summary"></div>
        <div class="panelwrap active textholder" id="p-codex"></div>
        <div class="panelwrap textholder" id="p-reflection"></div>
        <div class="panelwrap textholder mono" id="p-input"></div>
        <div class="codebox"><span class="t">C 代码显示框</span><span class="s">固定显示 · 语法高亮 · 可编译运行</span></div>
        <div class="panelwrap mono" id="p-code" style="min-height:170px;max-height:250px"></div>
      </div>
    </div>
  </div>
</div>
<div class="statusbar" id="status">加载中...</div>
<div id="viewer"><img id="viewer-img" src=""><div class="vfoot"><span id="viewer-name"></span><button onclick="closeViewer()">关闭</button></div></div>
<script id="notes-data" type="application/json">[{"id": 99, "date": "16", "title": "第16天-01：链表", "topics": "链表", "summary": "", "codex": "【笔记名称】\n第16天-01：链表\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 链表\n\n【核心概念】\n链表在运行时管理数据规模。核心不是“申请到内存”，而是明确所有权、容量变化和释放时机。\n\n【示例代码】\n#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Node { int value; struct Node *next; } Node;\nint main(void)\n{\n    Node *head = malloc(sizeof *head);\n    if (head == NULL) return 1;\n    *head = (Node){42, NULL};\n    printf(\"%d\\n\", head->value);\n    free(head);\n    return 0;\n}\n\n【代码拆解】\n1. malloc/realloc 返回的地址必须检查。\n2. 扩容时先保存 realloc 的临时返回值，成功后再替换旧指针。\n3. 每次成功申请最终都应对应一次 free。\n\n【容易踩坑】\n- 不要丢失原指针，不要重复释放，也不要在 free 后继续访问。\n\n【一句话记忆】\n谁申请，谁负责释放；谁扩容，谁维护容量。", "code": "", "reflection": "", "imgs": []}, {"id": 102, "date": "16", "title": "第16天-02：链表的函数", "topics": "链表的函数", "summary": "今天学到：\n\n卡住的地方：\n\n明天复习：", "codex": "【笔记名称】\n第16天-02：链表的函数\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 链表的函数\n\n【核心概念】\n链表的函数在运行时管理数据规模。核心不是“申请到内存”，而是明确所有权、容量变化和释放时机。\n\n【示例代码】\n#include <stdio.h>\n\nint add(int a, int b)\n{\n    return a + b;\n}\n\nint main(void)\n{\n    printf(\"%d\\n\", add(3, 5));\n    return 0;\n}\n\n【代码拆解】\n1. malloc/realloc 返回的地址必须检查。\n2. 扩容时先保存 realloc 的临时返回值，成功后再替换旧指针。\n3. 每次成功申请最终都应对应一次 free。\n\n【容易踩坑】\n- 不要丢失原指针，不要重复释放，也不要在 free 后继续访问。\n\n【一句话记忆】\n谁申请，谁负责释放；谁扩容，谁维护容量。", "code": "#include <stdio.h>\n\nint main(void)\n{\n    printf(\"Hello, C language!\\n\");\n    return 0;\n}\n", "reflection": "", "imgs": []}, {"id": 97, "date": "15", "title": "第15天-01：可变数组", "topics": "可变数组", "summary": "", "codex": "【笔记名称】\n第15天-01：可变数组\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 可变数组\n\n【核心概念】\n可变数组在运行时管理数据规模。核心不是“申请到内存”，而是明确所有权、容量变化和释放时机。\n\n【示例代码】\n#include <stdlib.h>\n\ntypedef struct {\n    int *data;\n    size_t size;\n    size_t capacity;\n} IntArray;\n\nvoid destroy(IntArray *a)\n{\n    free(a->data);\n    *a = (IntArray){0};\n}\n\n【代码拆解】\n1. malloc/realloc 返回的地址必须检查。\n2. 扩容时先保存 realloc 的临时返回值，成功后再替换旧指针。\n3. 每次成功申请最终都应对应一次 free。\n\n【容易踩坑】\n- 不要丢失原指针，不要重复释放，也不要在 free 后继续访问。\n\n【一句话记忆】\n谁申请，谁负责释放；谁扩容，谁维护容量。", "code": "", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260813-041128.png", "u": "images/97_QQ20260813-041128.png"}]}, {"id": 98, "date": "15", "title": "第15天-02：可变数组自动增长", "topics": "可变数组自动增长", "summary": "", "codex": "【笔记名称】\n第15天-02：可变数组自动增长\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 可变数组自动增长\n\n【核心概念】\n可变数组自动增长在运行时管理数据规模。核心不是“申请到内存”，而是明确所有权、容量变化和释放时机。\n\n【示例代码】\nif (array->size == array->capacity) {\n    size_t new_capacity = array->capacity ? array->capacity * 2 : 4;\n    int *new_data = realloc(array->data, new_capacity * sizeof *new_data);\n    if (new_data == NULL) return 0;\n    array->data = new_data;\n    array->capacity = new_capacity;\n}\n\n【代码拆解】\n1. malloc/realloc 返回的地址必须检查。\n2. 扩容时先保存 realloc 的临时返回值，成功后再替换旧指针。\n3. 每次成功申请最终都应对应一次 free。\n\n【容易踩坑】\n- 不要丢失原指针，不要重复释放，也不要在 free 后继续访问。\n\n【一句话记忆】\n谁申请，谁负责释放；谁扩容，谁维护容量。", "code": "", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260813-041634.png", "u": "images/98_QQ20260813-041634.png"}]}, {"id": 101, "date": "15", "title": "第15天-03：可变数组的缺陷", "topics": "可变数组的缺陷", "summary": "", "codex": "【笔记名称】\n第15天-03：可变数组的缺陷\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 可变数组的缺陷\n\n【核心概念】\n可变数组的缺陷在运行时管理数据规模。核心不是“申请到内存”，而是明确所有权、容量变化和释放时机。\n\n【示例代码】\n// 中间插入需要搬动后面的元素\nfor (size_t i = array->size; i > index; i--)\n    array->data[i] = array->data[i - 1];\narray->data[index] = value;\narray->size++;\n\n【代码拆解】\n1. malloc/realloc 返回的地址必须检查。\n2. 扩容时先保存 realloc 的临时返回值，成功后再替换旧指针。\n3. 每次成功申请最终都应对应一次 free。\n\n【容易踩坑】\n- 不要丢失原指针，不要重复释放，也不要在 free 后继续访问。\n\n【一句话记忆】\n谁申请，谁负责释放；谁扩容，谁维护容量。", "code": "", "reflection": "", "imgs": []}, {"id": 92, "date": "14", "title": "第14天-01：格式化输入输出表格", "topics": "格式化输入输出表格", "summary": "", "codex": "【笔记名称】\n第14天-01：格式化输入输出表格\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 格式化输入输出表格\n\n【核心概念】\n格式化输入输出表格的重点是格式与类型匹配，并检查每一步输入输出是否成功。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    printf(\"%-10s %6s\\n\", \"姓名\", \"分数\");\n    printf(\"%-10s %6d\\n\", \"Lele\", 95);\n    printf(\"%-10s %6.1f\\n\", \"平均\", 88.5);\n    return 0;\n}\n\n【代码拆解】\n1. printf 控制显示宽度和精度，scanf 读取时通常需要变量地址。\n2. fopen 成功后得到 FILE*，失败时返回 NULL。\n3. 使用完成后 fclose，并检查重要操作的返回值。\n\n【容易踩坑】\n- 格式符写错会造成未定义行为；文件路径、权限和磁盘错误也必须考虑。\n\n【一句话记忆】\n输入输出都可能失败，返回值就是第一道保险。", "code": "", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260812-002516.png", "u": "images/92_QQ20260812-002516.png"}, {"a": "summary", "n": "QQ20260812-002727.png", "u": "images/92_QQ20260812-002727.png"}]}, {"id": 93, "date": "14", "title": "第14天-02：文件输入输出", "topics": "文件输入输出", "summary": "", "codex": "【笔记名称】\n第14天-02：文件输入输出\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 文件输入输出\n\n【核心概念】\n文件输入输出的重点是格式与类型匹配，并检查每一步输入输出是否成功。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    FILE *fp = fopen(\"note.txt\", \"w\");\n    if (fp == NULL) { perror(\"fopen\"); return 1; }\n    fprintf(fp, \"Hello, file!\\n\");\n    if (fclose(fp) != 0) return 1;\n    return 0;\n}\n\n【代码拆解】\n1. printf 控制显示宽度和精度，scanf 读取时通常需要变量地址。\n2. fopen 成功后得到 FILE*，失败时返回 NULL。\n3. 使用完成后 fclose，并检查重要操作的返回值。\n\n【容易踩坑】\n- 格式符写错会造成未定义行为；文件路径、权限和磁盘错误也必须考虑。\n\n【一句话记忆】\n输入输出都可能失败，返回值就是第一道保险。", "code": "", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260812-003447.png", "u": "images/93_QQ20260812-003447.png"}]}, {"id": 94, "date": "14", "title": "第14天-03：位段", "topics": "位段", "summary": "", "codex": "【笔记名称】\n第14天-03：位段\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 位段\n\n【核心概念】\n位段决定数据如何编码、占多少空间以及能表示什么范围。选择类型时应先看数据含义，再看范围和精度。\n\n【示例代码】\n#include <stdio.h>\n\nstruct Flags { unsigned ready : 1; unsigned mode : 2; };\nint main(void)\n{\n    struct Flags f = {1, 2};\n    printf(\"ready=%u mode=%u\\n\", f.ready, f.mode);\n    return 0;\n}\n\n【代码拆解】\n1. sizeof 查看对象或类型占用的字节数。\n2. 整数运算会截断小数，浮点数通常只能近似表示十进制小数。\n3. 不同进制只是同一个整数的不同书写或显示方式。\n\n【容易踩坑】\n- 不要假设所有平台上的类型大小完全相同；格式符必须与实际类型对应。\n\n【一句话记忆】\n类型决定解释数据的方式。", "code": "", "reflection": "", "imgs": []}, {"id": 95, "date": "14", "title": "第14天-04：二进制相关", "topics": "二进制相关", "summary": "", "codex": "【笔记名称】\n第14天-04：二进制相关\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 二进制相关\n\n【核心概念】\n二进制相关决定数据如何编码、占多少空间以及能表示什么范围。选择类型时应先看数据含义，再看范围和精度。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    unsigned n = 26;\n    printf(\"十进制=%u 八进制=%o 十六进制=%X\\n\", n, n, n);\n    printf(\"最低位=%u\\n\", n & 1u);\n    return 0;\n}\n\n【代码拆解】\n1. sizeof 查看对象或类型占用的字节数。\n2. 整数运算会截断小数，浮点数通常只能近似表示十进制小数。\n3. 不同进制只是同一个整数的不同书写或显示方式。\n\n【容易踩坑】\n- 不要假设所有平台上的类型大小完全相同；格式符必须与实际类型对应。\n\n【一句话记忆】\n类型决定解释数据的方式。", "code": "", "reflection": "", "imgs": []}, {"id": 87, "date": "13", "title": "第13天-01：宏", "topics": "宏", "summary": "", "codex": "【笔记名称】\n第13天-01：宏\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 宏\n\n【核心概念】\n宏发生在编译前后不同阶段：预处理器负责展开宏和包含头文件，编译器根据声明检查类型。\n\n【示例代码】\n#include <stdio.h>\n\n#define PI 3.1415926\n#define ARRAY_LEN(a) (sizeof(a) / sizeof((a)[0]))\nint main(void)\n{\n    int a[] = {1, 2, 3};\n    printf(\"PI=%.2f 个数=%zu\\n\", PI, ARRAY_LEN(a));\n    return 0;\n}\n\n【代码拆解】\n1. 对象宏适合常量，参数宏必须给参数和整体加括号。\n2. 头文件放声明并使用 include guard。\n3. .c 文件放实现，多个源文件最后由链接器组合。\n\n【容易踩坑】\n- 宏只是文本替换，参数可能被求值多次；能用 const 或函数时通常更安全。\n\n【一句话记忆】\n头文件讲接口，源文件写实现。", "code": "", "reflection": "", "imgs": [{"a": "summary", "n": "微信图片_20260811090106_106_444.png", "u": "images/87_微信图片_20260811090106_106_444.png"}]}, {"id": 88, "date": "13", "title": "第13天-02：参数宏", "topics": "参数宏", "summary": "", "codex": "【笔记名称】\n第13天-02：参数宏\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 参数宏\n\n【核心概念】\n参数宏用于拆分职责和控制数据作用范围。函数应完成一件清楚的事，并通过参数接收输入、通过返回值或指针给出结果。\n\n【示例代码】\n#include <stdio.h>\n\n#define SQUARE(x) ((x) * (x))\n#define MAX(a, b) ((a) > (b) ? (a) : (b))\nint main(void)\n{\n    printf(\"%d %d\\n\", SQUARE(5), MAX(3, 8));\n    return 0;\n}\n\n【代码拆解】\n1. 声明告诉编译器函数长什么样。\n2. 调用时普通参数按值复制，修改副本不会改变原变量。\n3. 需要修改调用者数据时传入地址，并在函数内解引用。\n\n【容易踩坑】\n- 避免让函数依赖过多全局状态；变量应放在能够满足需求的最小作用域。\n\n【一句话记忆】\n参数传输入，返回值传结果，指针传可修改对象。", "code": "", "reflection": "", "imgs": [{"a": "summary", "n": "微信图片_20260811090106_106_444.png", "u": "images/88_微信图片_20260811090106_106_444.png"}, {"a": "summary", "n": "QQ20260811-090833.png", "u": "images/88_QQ20260811-090833.png"}]}, {"id": 89, "date": "13", "title": "第13天-03：源代码文件", "topics": "源代码文件", "summary": "", "codex": "【笔记名称】\n第13天-03：源代码文件\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 源代码文件\n\n【核心概念】\n源代码文件发生在编译前后不同阶段：预处理器负责展开宏和包含头文件，编译器根据声明检查类型。\n\n【示例代码】\n// math_utils.h\n#ifndef MATH_UTILS_H\n#define MATH_UTILS_H\nint add(int a, int b);\n#endif\n\n// math_utils.c\n#include \"math_utils.h\"\nint add(int a, int b) { return a + b; }\n\n【代码拆解】\n1. 对象宏适合常量，参数宏必须给参数和整体加括号。\n2. 头文件放声明并使用 include guard。\n3. .c 文件放实现，多个源文件最后由链接器组合。\n\n【容易踩坑】\n- 宏只是文本替换，参数可能被求值多次；能用 const 或函数时通常更安全。\n\n【一句话记忆】\n头文件讲接口，源文件写实现。", "code": "", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260811-091427.png", "u": "images/89_QQ20260811-091427.png"}]}, {"id": 90, "date": "13", "title": "第13天-04：声明", "topics": "声明", "summary": "", "codex": "【笔记名称】\n第13天-04：声明\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 声明\n\n【核心概念】\n声明发生在编译前后不同阶段：预处理器负责展开宏和包含头文件，编译器根据声明检查类型。\n\n【示例代码】\n// math_utils.h\n#ifndef MATH_UTILS_H\n#define MATH_UTILS_H\nint add(int a, int b);\n#endif\n\n// math_utils.c\n#include \"math_utils.h\"\nint add(int a, int b) { return a + b; }\n\n【代码拆解】\n1. 对象宏适合常量，参数宏必须给参数和整体加括号。\n2. 头文件放声明并使用 include guard。\n3. .c 文件放实现，多个源文件最后由链接器组合。\n\n【容易踩坑】\n- 宏只是文本替换，参数可能被求值多次；能用 const 或函数时通常更安全。\n\n【一句话记忆】\n头文件讲接口，源文件写实现。", "code": "", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260811-093946.png", "u": "images/90_QQ20260811-093946.png"}, {"a": "summary", "n": "QQ20260811-094502.png", "u": "images/90_QQ20260811-094502.png"}]}, {"id": 91, "date": "13", "title": "第13天-05：格式化输入输出", "topics": "格式化输入输出", "summary": "", "codex": "【笔记名称】\n第13天-05：格式化输入输出\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 格式化输入输出\n\n【核心概念】\n格式化输入输出的重点是格式与类型匹配，并检查每一步输入输出是否成功。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    int age; double height;\n    if (scanf(\"%d %lf\", &age, &height) == 2)\n        printf(\"年龄=%d 身高=%.2f\\n\", age, height);\n    return 0;\n}\n\n【代码拆解】\n1. printf 控制显示宽度和精度，scanf 读取时通常需要变量地址。\n2. fopen 成功后得到 FILE*，失败时返回 NULL。\n3. 使用完成后 fclose，并检查重要操作的返回值。\n\n【容易踩坑】\n- 格式符写错会造成未定义行为；文件路径、权限和磁盘错误也必须考虑。\n\n【一句话记忆】\n输入输出都可能失败，返回值就是第一道保险。", "code": "", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260811-095624.png", "u": "images/91_QQ20260811-095624.png"}]}, {"id": 83, "date": "12", "title": "第12天-02：联合", "topics": "联合", "summary": "没啥笔记可以做的", "codex": "【笔记名称】\n第12天-02：联合\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 联合\n\n【核心概念】\n联合把相关数据组织成更清楚的自定义类型，让代码表达业务含义而不是只堆基础类型。\n\n【示例代码】\n#include <stdio.h>\n\nunion Value { int number; float decimal; };\nint main(void)\n{\n    union Value v;\n    v.number = 42;\n    printf(\"%d，联合大小=%zu\\n\", v.number, sizeof v);\n    return 0;\n}\n\n【代码拆解】\n1. enum 为一组命名整数赋予含义。\n2. struct 的成员各自占空间并同时存在。\n3. union 的成员共享同一片空间，同一时刻只应把一个成员当作有效值。\n\n【容易踩坑】\n- 结构体通过 . 访问，结构体指针通过 -> 访问；联合体必须额外记录当前有效成员。\n\n【一句话记忆】\n类型设计得清楚，后面的代码自然更好读。", "code": "", "reflection": "", "imgs": []}, {"id": 82, "date": "12", "title": "第12天-01：定义类型", "topics": "定义类型", "summary": "", "codex": "【笔记名称】\n第12天-01：定义类型\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 定义类型\n\n【核心概念】\n定义类型把相关数据组织成更清楚的自定义类型，让代码表达业务含义而不是只堆基础类型。\n\n【示例代码】\n#include <stdio.h>\n\ntypedef unsigned long ulong;\ntypedef struct { int x, y; } Point;\nint main(void)\n{\n    ulong count = 100; Point p = {3, 4};\n    printf(\"%lu (%d,%d)\\n\", count, p.x, p.y);\n    return 0;\n}\n\n【代码拆解】\n1. enum 为一组命名整数赋予含义。\n2. struct 的成员各自占空间并同时存在。\n3. union 的成员共享同一片空间，同一时刻只应把一个成员当作有效值。\n\n【容易踩坑】\n- 结构体通过 . 访问，结构体指针通过 -> 访问；联合体必须额外记录当前有效成员。\n\n【一句话记忆】\n类型设计得清楚，后面的代码自然更好读。", "code": "", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260810-080300.png", "u": "images/82_QQ20260810-080300.png"}, {"a": "summary", "n": "QQ20260810-080458.png", "u": "images/82_QQ20260810-080458.png"}]}, {"id": 84, "date": "12", "title": "第12天-03：全局变量和静态本地变量", "topics": "全局变量和静态本地变量", "summary": "", "codex": "【笔记名称】\n第12天-03：全局变量和静态本地变量\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 全局变量和静态本地变量\n\n【核心概念】\n全局变量和静态本地变量用于拆分职责和控制数据作用范围。函数应完成一件清楚的事，并通过参数接收输入、通过返回值或指针给出结果。\n\n【示例代码】\n#include <stdio.h>\n\nint global_count = 0;\nvoid visit(void)\n{\n    static int times = 0;\n    int local = 10;\n    printf(\"times=%d local=%d global=%d\\n\", ++times, local, ++global_count);\n}\nint main(void) { visit(); visit(); return 0; }\n\n【代码拆解】\n1. 声明告诉编译器函数长什么样。\n2. 调用时普通参数按值复制，修改副本不会改变原变量。\n3. 需要修改调用者数据时传入地址，并在函数内解引用。\n\n【容易踩坑】\n- 避免让函数依赖过多全局状态；变量应放在能够满足需求的最小作用域。\n\n【一句话记忆】\n参数传输入，返回值传结果，指针传可修改对象。", "code": "", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260810-083945.png", "u": "images/84_QQ20260810-083945.png"}]}, {"id": 77, "date": "11", "title": "第11天-01：字符串搜索函数", "topics": "字符串搜索函数", "summary": "", "codex": "【笔记名称】\n第11天-01：字符串搜索函数\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 字符串搜索函数\n\n【核心概念】\n字符串搜索函数把一组同类型数据按顺序保存。访问时要同时盯住容量、有效长度和结尾标记。\n\n【示例代码】\n#include <stdio.h>\n\nint add(int a, int b)\n{\n    return a + b;\n}\n\nint main(void)\n{\n    printf(\"%d\\n\", add(3, 5));\n    return 0;\n}\n\n【代码拆解】\n1. 数组下标从 0 开始，最后一个有效下标是元素个数减 1。\n2. 字符串本质是以 \\0 结束的 char 数组。\n3. 遍历条件应由实际长度或结束符控制。\n\n【容易踩坑】\n- 最常见错误是越界；字符串还要给结尾的 \\0 留一个字节。\n\n【一句话记忆】\n容量决定能放多少，长度决定现在用了多少。", "code": "", "reflection": "", "imgs": []}, {"id": 78, "date": "11", "title": "第11天-02：枚举", "topics": "枚举", "summary": "", "codex": "【笔记名称】\n第11天-02：枚举\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 枚举\n\n【核心概念】\n枚举把相关数据组织成更清楚的自定义类型，让代码表达业务含义而不是只堆基础类型。\n\n【示例代码】\n#include <stdio.h>\n\nenum Day { MON = 1, TUE, WED };\nint main(void)\n{\n    enum Day today = TUE;\n    printf(\"%d\\n\", today);\n    return 0;\n}\n\n【代码拆解】\n1. enum 为一组命名整数赋予含义。\n2. struct 的成员各自占空间并同时存在。\n3. union 的成员共享同一片空间，同一时刻只应把一个成员当作有效值。\n\n【容易踩坑】\n- 结构体通过 . 访问，结构体指针通过 -> 访问；联合体必须额外记录当前有效成员。\n\n【一句话记忆】\n类型设计得清楚，后面的代码自然更好读。", "code": "", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260809-084546.png", "u": "images/78_QQ20260809-084546.png"}, {"a": "summary", "n": "QQ20260809-084619.png", "u": "images/78_QQ20260809-084619.png"}]}, {"id": 79, "date": "11", "title": "第11天-03：结构类型", "topics": "结构类型", "summary": "", "codex": "【笔记名称】\n第11天-03：结构类型\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 结构类型\n\n【核心概念】\n结构类型把相关数据组织成更清楚的自定义类型，让代码表达业务含义而不是只堆基础类型。\n\n【示例代码】\n#include <stdio.h>\n\nstruct Student { char name[20]; int score; };\nint main(void)\n{\n    struct Student s = {\"Lele\", 95};\n    printf(\"%s：%d\\n\", s.name, s.score);\n    return 0;\n}\n\n【代码拆解】\n1. enum 为一组命名整数赋予含义。\n2. struct 的成员各自占空间并同时存在。\n3. union 的成员共享同一片空间，同一时刻只应把一个成员当作有效值。\n\n【容易踩坑】\n- 结构体通过 . 访问，结构体指针通过 -> 访问；联合体必须额外记录当前有效成员。\n\n【一句话记忆】\n类型设计得清楚，后面的代码自然更好读。", "code": "#include <stdio.h>\n\nstruct date {\n    int month;\n    int day;\n    int year;\n};\n\nint main(int argc, char const *argv[])\n{\n    struct date today;\n\n    today = (struct date){07, 31, 2014};\n\n    struct date day;\n\n    struct date *pDate = &today;\n\n    printf(\"Today's date is %i-%i-%i\\n\",\n        today.year, today.month, today.day);\n\n    printf(\"Tomorrow's date is %i-%i-%i\\n\",\n        day.year, day.month, day.day);\n\n    printf(\"address of today is %p\\n\", pDate);\n\n    return 0;\n}", "reflection": "", "imgs": []}, {"id": 80, "date": "11", "title": "第11天-04：结构和函数", "topics": "结构和函数", "summary": "", "codex": "【笔记名称】\n第11天-04：结构和函数\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 结构和函数\n\n【核心概念】\n结构和函数用于拆分职责和控制数据作用范围。函数应完成一件清楚的事，并通过参数接收输入、通过返回值或指针给出结果。\n\n【示例代码】\n#include <stdio.h>\n\nint add(int a, int b)\n{\n    return a + b;\n}\n\nint main(void)\n{\n    printf(\"%d\\n\", add(3, 5));\n    return 0;\n}\n\n【代码拆解】\n1. 声明告诉编译器函数长什么样。\n2. 调用时普通参数按值复制，修改副本不会改变原变量。\n3. 需要修改调用者数据时传入地址，并在函数内解引用。\n\n【容易踩坑】\n- 避免让函数依赖过多全局状态；变量应放在能够满足需求的最小作用域。\n\n【一句话记忆】\n参数传输入，返回值传结果，指针传可修改对象。", "code": "", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260809-085747.png", "u": "images/80_QQ20260809-085747.png"}, {"a": "summary", "n": "QQ20260809-100005.png", "u": "images/80_QQ20260809-100005.png"}, {"a": "summary", "n": "QQ20260809-100708.png", "u": "images/80_QQ20260809-100708.png"}]}, {"id": 75, "date": "10", "title": "第10天-05：字符串函数strcpy与strcat", "topics": "字符串函数strcpy与strcat", "summary": "", "codex": "【笔记名称】\n第10天-05：字符串函数strcpy与strcat\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 字符串函数strcpy与strcat\n\n【核心概念】\n字符串函数strcpy与strcat把一组同类型数据按顺序保存。访问时要同时盯住容量、有效长度和结尾标记。\n\n【示例代码】\n#include <stdio.h>\n\nint add(int a, int b)\n{\n    return a + b;\n}\n\nint main(void)\n{\n    printf(\"%d\\n\", add(3, 5));\n    return 0;\n}\n\n【代码拆解】\n1. 数组下标从 0 开始，最后一个有效下标是元素个数减 1。\n2. 字符串本质是以 \\0 结束的 char 数组。\n3. 遍历条件应由实际长度或结束符控制。\n\n【容易踩坑】\n- 最常见错误是越界；字符串还要给结尾的 \\0 留一个字节。\n\n【一句话记忆】\n容量决定能放多少，长度决定现在用了多少。", "code": "", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260808-100946.png", "u": "images/75_QQ20260808-100946.png"}, {"a": "summary", "n": "QQ20260808-101427.png", "u": "images/75_QQ20260808-101427.png"}]}, {"id": 67, "date": "10", "title": "第10天-01：字符串输入输出", "topics": "字符串输入输出", "summary": "\nchar colors[][10] = {\n    \"red\",\n    \"green\",\n    \"blue\"\n};\n无论字符串实际有多长，每一行都固定占10字节。\n总空间为：\n3 × 10 = 30字节\n优点：\n数据全部连续存放；\n每个字符都可以修改；\n内存结构简单。\n缺点：\n短字符串会浪费空间；\n所有字符串最大长度相同；\n必须提前确定每行容量。\n3. 指针数组\n另一种方式是：\nconst char *colors[] = {\n    \"red\",\n    \"green\",\n    \"blue\"\n};\n这里 colors 是一个数组，但数组中的每个元素不是字符，而是一个字符指针。\n可以理解为：\ncolors[0] -> \"red\"\ncolors[1] -> \"green\"\ncolors[2] -> \"blue\"\n数组里保存的是各个字符串的地址。\n访问方法不变：\nprintf(\"%s\\n\", colors[1]);\n仍然输出：\ngreen\n4. 指针数组的特点\n优点：\n不要求每个字符串长度相同；\n字符串较短时不会为固定行宽浪费太多空间；\n可以通过交换指针快速调整字符串顺序。\n例如：\nconst char *temp = colors[0];\ncolors[0] = colors[2];\ncolors[2] = temp;\n交换的是地址，不需要逐个复制字符。\n缺点：\n数组中的内容是指针，字符串实际存放在其他位置；\n如果指向字符串字面量，就不能修改字符串内容；\n内存关系比二维数组稍复杂。\n5. 两种形式对比\n二维字符数组\nchar names[][10] = {\n    \"Tom\",\n    \"Alice\",\n    \"Bob\"\n};\n可以修改：\nnames[0][0] = 'S';\n修改后 \"Tom\"变成 \"Som\"。\n字符指针数组\nconst char *names[] = {\n    \"Tom\",\n    \"Alice\",\n    \"Bob\"\n};\n不能执行：\nnames[0][0] = 'S';\n因为它指向字符串字面量。\n但是可以改变某个指针的指向：\nnames[0] = \"Jack\";\n", "codex": "【笔记名称】\n第10天-01：字符串输入输出\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 字符串输入输出\n\n【核心概念】\n字符串输入输出把一组同类型数据按顺序保存。访问时要同时盯住容量、有效长度和结尾标记。\n\n【示例代码】\n#include <stdio.h>\n#include <string.h>\n\nint main(void)\n{\n    char line[100];\n    if (fgets(line, sizeof line, stdin) != NULL) {\n        line[strcspn(line, \"\\n\")] = '\\0';\n        printf(\"你输入了：%s\\n\", line);\n    }\n    return 0;\n}\n\n【代码拆解】\n1. 数组下标从 0 开始，最后一个有效下标是元素个数减 1。\n2. 字符串本质是以 \\0 结束的 char 数组。\n3. 遍历条件应由实际长度或结束符控制。\n\n【容易踩坑】\n- 最常见错误是越界；字符串还要给结尾的 \\0 留一个字节。\n\n【一句话记忆】\n容量决定能放多少，长度决定现在用了多少。", "code": "#include <stdio.h>\n\nint main(void)\n{\n    char line[100];\n\n    printf(\"请输入一句话：\");\n\n    if (fgets(line, sizeof(line), stdin) != NULL) {\n        printf(\"你输入的是：%s\", line);\n    }\n\n    return 0;\n}", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260807-083842.png", "u": "images/67_QQ20260807-083842.png"}]}, {"id": 72, "date": "10", "title": "第10天-02：程序参数", "topics": "程序参数", "summary": "", "codex": "【笔记名称】\n第10天-02：程序参数\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 程序参数\n\n【核心概念】\n程序参数用于拆分职责和控制数据作用范围。函数应完成一件清楚的事，并通过参数接收输入、通过返回值或指针给出结果。\n\n【示例代码】\n#include <stdio.h>\n\nint main(int argc, char *argv[])\n{\n    printf(\"参数个数=%d\\n\", argc);\n    for (int i = 0; i < argc; i++)\n        printf(\"argv[%d]=%s\\n\", i, argv[i]);\n    return 0;\n}\n\n【代码拆解】\n1. 声明告诉编译器函数长什么样。\n2. 调用时普通参数按值复制，修改副本不会改变原变量。\n3. 需要修改调用者数据时传入地址，并在函数内解引用。\n\n【容易踩坑】\n- 避免让函数依赖过多全局状态；变量应放在能够满足需求的最小作用域。\n\n【一句话记忆】\n参数传输入，返回值传结果，指针传可修改对象。", "code": "", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260808-075958.png", "u": "images/72_QQ20260808-075958.png"}]}, {"id": 73, "date": "10", "title": "第10天-03：字符串函数strlen", "topics": "字符串函数strlen", "summary": "", "codex": "【笔记名称】\n第10天-03：字符串函数strlen\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 字符串函数strlen\n\n【核心概念】\n字符串函数strlen把一组同类型数据按顺序保存。访问时要同时盯住容量、有效长度和结尾标记。\n\n【示例代码】\n#include <stdio.h>\n\nint add(int a, int b)\n{\n    return a + b;\n}\n\nint main(void)\n{\n    printf(\"%d\\n\", add(3, 5));\n    return 0;\n}\n\n【代码拆解】\n1. 数组下标从 0 开始，最后一个有效下标是元素个数减 1。\n2. 字符串本质是以 \\0 结束的 char 数组。\n3. 遍历条件应由实际长度或结束符控制。\n\n【容易踩坑】\n- 最常见错误是越界；字符串还要给结尾的 \\0 留一个字节。\n\n【一句话记忆】\n容量决定能放多少，长度决定现在用了多少。", "code": "", "reflection": "", "imgs": []}, {"id": 74, "date": "10", "title": "第10天-04：字符串函数strcmp", "topics": "字符串函数strcmp", "summary": "", "codex": "【笔记名称】\n第10天-04：字符串函数strcmp\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 字符串函数strcmp\n\n【核心概念】\n字符串函数strcmp把一组同类型数据按顺序保存。访问时要同时盯住容量、有效长度和结尾标记。\n\n【示例代码】\n#include <stdio.h>\n\nint add(int a, int b)\n{\n    return a + b;\n}\n\nint main(void)\n{\n    printf(\"%d\\n\", add(3, 5));\n    return 0;\n}\n\n【代码拆解】\n1. 数组下标从 0 开始，最后一个有效下标是元素个数减 1。\n2. 字符串本质是以 \\0 结束的 char 数组。\n3. 遍历条件应由实际长度或结束符控制。\n\n【容易踩坑】\n- 最常见错误是越界；字符串还要给结尾的 \\0 留一个字节。\n\n【一句话记忆】\n容量决定能放多少，长度决定现在用了多少。", "code": "", "reflection": "", "imgs": []}, {"id": 64, "date": "9", "title": "第09天-01：动态内存分配", "topics": "动态内存分配", "summary": "int *a;\n只定义了一个指针变量 a，还没有数组，也没有用于存储整数的空间。此时不能直接使用 a[0]。\n必须申请内存：\nint *a;\na = malloc(number * sizeof(int));\n这两行合起来，在使用效果上类似于：\nint a[number];\n都可以这样访问元素：\na[0] = 10;\na[1] = 20;\n主要区别：\nint a[number];\n直接创建数组。\n通常使用栈空间。\n不需要手动释放。\n只能在支持变长数组（VLA）的编译器中使用。\nint *a = malloc(number * sizeof(int));\na 是指针，数组空间通过 malloc()创建。\n使用堆空间。\n使用结束后必须释放：\nfree(a);\n所以准确说法是：\nint *a;\n不相当于：\nint a[number];", "codex": "【笔记名称】\n第09天-01：动态内存分配\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 动态内存分配\n\n【核心概念】\n动态内存分配在运行时管理数据规模。核心不是“申请到内存”，而是明确所有权、容量变化和释放时机。\n\n【示例代码】\n#include <stdio.h>\n#include <stdlib.h>\n\nint main(void)\n{\n    size_t n = 5;\n    int *a = malloc(n * sizeof *a);\n    if (a == NULL) return 1;\n    for (size_t i = 0; i < n; i++) a[i] = (int)i * 10;\n    free(a);\n    a = NULL;\n    return 0;\n}\n\n【代码拆解】\n1. malloc/realloc 返回的地址必须检查。\n2. 扩容时先保存 realloc 的临时返回值，成功后再替换旧指针。\n3. 每次成功申请最终都应对应一次 free。\n\n【容易踩坑】\n- 不要丢失原指针，不要重复释放，也不要在 free 后继续访问。\n\n【一句话记忆】\n谁申请，谁负责释放；谁扩容，谁维护容量。", "code": "", "reflection": "", "imgs": []}, {"id": 65, "date": "9", "title": "第09天-02：字符串", "topics": "字符串", "summary": "", "codex": "【笔记名称】\n第09天-02：字符串\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 字符串\n\n【核心概念】\n字符串把一组同类型数据按顺序保存。访问时要同时盯住容量、有效长度和结尾标记。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    char name[] = \"Codex\";\n    for (size_t i = 0; name[i] != '\\0'; i++)\n        printf(\"%c \", name[i]);\n    return 0;\n}\n\n【代码拆解】\n1. 数组下标从 0 开始，最后一个有效下标是元素个数减 1。\n2. 字符串本质是以 \\0 结束的 char 数组。\n3. 遍历条件应由实际长度或结束符控制。\n\n【容易踩坑】\n- 最常见错误是越界；字符串还要给结尾的 \\0 留一个字节。\n\n【一句话记忆】\n容量决定能放多少，长度决定现在用了多少。", "code": "", "reflection": "", "imgs": []}, {"id": 66, "date": "9", "title": "第09天-03：字符串常量", "topics": "字符串常量", "summary": "", "codex": "【笔记名称】\n第09天-03：字符串常量\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 字符串常量\n\n【核心概念】\n字符串常量把一组同类型数据按顺序保存。访问时要同时盯住容量、有效长度和结尾标记。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    const char *message = \"Hello\";\n    printf(\"%s\\n\", message);\n    return 0;\n}\n\n【代码拆解】\n1. 数组下标从 0 开始，最后一个有效下标是元素个数减 1。\n2. 字符串本质是以 \\0 结束的 char 数组。\n3. 遍历条件应由实际长度或结束符控制。\n\n【容易踩坑】\n- 最常见错误是越界；字符串还要给结尾的 \\0 留一个字节。\n\n【一句话记忆】\n容量决定能放多少，长度决定现在用了多少。", "code": "", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260807-081545.png", "u": "images/66_QQ20260807-081545.png"}, {"a": "summary", "n": "QQ20260807-081701.png", "u": "images/66_QQ20260807-081701.png"}, {"a": "summary", "n": "QQ20260807-081834.png", "u": "images/66_QQ20260807-081834.png"}]}, {"id": 68, "date": "9", "title": "第09天-04：字符串数组", "topics": "字符串数组", "summary": "", "codex": "【笔记名称】\n第09天-04：字符串数组\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 字符串数组\n\n【核心概念】\n字符串数组把一组同类型数据按顺序保存。访问时要同时盯住容量、有效长度和结尾标记。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    const char *colors[] = {\"red\", \"green\", \"blue\"};\n    size_t count = sizeof colors / sizeof colors[0];\n    for (size_t i = 0; i < count; i++) puts(colors[i]);\n    return 0;\n}\n\n【代码拆解】\n1. 数组下标从 0 开始，最后一个有效下标是元素个数减 1。\n2. 字符串本质是以 \\0 结束的 char 数组。\n3. 遍历条件应由实际长度或结束符控制。\n\n【容易踩坑】\n- 最常见错误是越界；字符串还要给结尾的 \\0 留一个字节。\n\n【一句话记忆】\n容量决定能放多少，长度决定现在用了多少。", "code": "", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260807-085621.png", "u": "images/68_QQ20260807-085621.png"}]}, {"id": 58, "date": "8", "title": "第08天-03：指针的应用", "topics": "指针的应用", "summary": "", "codex": "【笔记名称】\n第08天-03：指针的应用\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 指针的应用\n\n【核心概念】\n本节核心是用地址间接访问数据。指针变量保存地址，* 用来读取或修改该地址中的值。\n\n【示例代码】\n#include <stdio.h>\n\nvoid double_value(int *p) { *p *= 2; }\nint main(void)\n{\n    int n = 7;\n    double_value(&n);\n    printf(\"%d\\n\", n);\n    return 0;\n}\n\n【代码拆解】\n1. &value 取得变量地址，赋给类型匹配的指针。\n2. *p 是解引用；修改 *p 就是在修改原变量。\n3. 指针参与数组访问时，每次加 1 会前进一个元素。\n\n【容易踩坑】\n- 指针必须先指向有效对象；不要解引用 NULL、野指针或已经释放的地址。\n\n【一句话记忆】\n指针存地址，解引用取数据。", "code": "#include <stdio.h>\n\nvoid swap(int *a, int *b)\n{\n    int temp = *a;\n    *a = *b;\n    *b = temp;\n}\n\nint main(void)\n{\n    int x = 5;\n    int y = 8;\n\n    swap(&x, &y);\n    printf(\"x = %d, y = %d\\n\", x, y);\n\n    return 0;\n}\n", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260806-084610.png", "u": "images/58_QQ20260806-084610.png"}]}, {"id": 56, "date": "8", "title": "第08天-01：取地址运算符", "topics": "取地址运算符", "summary": "", "codex": "【笔记名称】\n第08天-01：取地址运算符\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 取地址运算符\n\n【核心概念】\n本节核心是用地址间接访问数据。指针变量保存地址，* 用来读取或修改该地址中的值。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    int a = 66, b = 12;\n    printf(\"和=%d 差=%d 积=%d 余数=%d\\n\",\n           a + b, a - b, a * b, a % b);\n    return 0;\n}\n\n【代码拆解】\n1. &value 取得变量地址，赋给类型匹配的指针。\n2. *p 是解引用；修改 *p 就是在修改原变量。\n3. 指针参与数组访问时，每次加 1 会前进一个元素。\n\n【容易踩坑】\n- 指针必须先指向有效对象；不要解引用 NULL、野指针或已经释放的地址。\n\n【一句话记忆】\n指针存地址，解引用取数据。", "code": "#include <stdio.h>\n\nint main(void)\n{\n    int number = 42;\n\n    printf(\"number = %d\\n\", number);\n    printf(\"address = %p\\n\", (void *)&number);\n\n    return 0;\n}\n", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260806-081337.png", "u": "images/56_QQ20260806-081337.png"}]}, {"id": 57, "date": "8", "title": "第08天-02：指针", "topics": "指针", "summary": "", "codex": "【笔记名称】\n第08天-02：指针\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 指针\n\n【核心概念】\n本节核心是用地址间接访问数据。指针变量保存地址，* 用来读取或修改该地址中的值。\n\n【示例代码】\n#include <stdio.h>\n\nvoid double_value(int *p) { *p *= 2; }\nint main(void)\n{\n    int n = 7;\n    double_value(&n);\n    printf(\"%d\\n\", n);\n    return 0;\n}\n\n【代码拆解】\n1. &value 取得变量地址，赋给类型匹配的指针。\n2. *p 是解引用；修改 *p 就是在修改原变量。\n3. 指针参与数组访问时，每次加 1 会前进一个元素。\n\n【容易踩坑】\n- 指针必须先指向有效对象；不要解引用 NULL、野指针或已经释放的地址。\n\n【一句话记忆】\n指针存地址，解引用取数据。", "code": "#include <stdio.h>\n\nint main(void)\n{\n    int number = 10;\n    int *pointer = &number;\n\n    printf(\"number = %d\\n\", number);\n    printf(\"address = %p\\n\", (void *)pointer);\n\n    *pointer = 20;\n    printf(\"new number = %d\\n\", number);\n\n    return 0;\n}\n", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260806-083411.png", "u": "images/57_QQ20260806-083411.png"}]}, {"id": 59, "date": "8", "title": "第08天-04：数组和指针", "topics": "数组和指针", "summary": "", "codex": "【笔记名称】\n第08天-04：数组和指针\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 数组和指针\n\n【核心概念】\n本节核心是用地址间接访问数据。指针变量保存地址，* 用来读取或修改该地址中的值。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    int scores[5] = {86, 92, 75, 88, 90};\n    int sum = 0;\n    for (size_t i = 0; i < 5; i++) sum += scores[i];\n    printf(\"平均分=%.1f\\n\", sum / 5.0);\n    return 0;\n}\n\n【代码拆解】\n1. &value 取得变量地址，赋给类型匹配的指针。\n2. *p 是解引用；修改 *p 就是在修改原变量。\n3. 指针参与数组访问时，每次加 1 会前进一个元素。\n\n【容易踩坑】\n- 指针必须先指向有效对象；不要解引用 NULL、野指针或已经释放的地址。\n\n【一句话记忆】\n指针存地址，解引用取数据。", "code": "", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260806-084610.png", "u": "images/59_QQ20260806-084610.png"}, {"a": "summary", "n": "QQ20260806-091755.png", "u": "images/59_QQ20260806-091755.png"}, {"a": "summary", "n": "QQ20260806-092206.png", "u": "images/59_QQ20260806-092206.png"}]}, {"id": 60, "date": "8", "title": "第08天-05：指针与const", "topics": "指针与const", "summary": "", "codex": "【笔记名称】\n第08天-05：指针与const\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 指针与const\n\n【核心概念】\n本节核心是用地址间接访问数据。指针变量保存地址，* 用来读取或修改该地址中的值。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    int a = 10, b = 20;\n    const int *p = &a;  // 不能通过p改值\n    p = &b;             // 可以改变p的指向\n    printf(\"%d\\n\", *p);\n    return 0;\n}\n\n【代码拆解】\n1. &value 取得变量地址，赋给类型匹配的指针。\n2. *p 是解引用；修改 *p 就是在修改原变量。\n3. 指针参与数组访问时，每次加 1 会前进一个元素。\n\n【容易踩坑】\n- 指针必须先指向有效对象；不要解引用 NULL、野指针或已经释放的地址。\n\n【一句话记忆】\n指针存地址，解引用取数据。", "code": "", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260806-094210.png", "u": "images/60_QQ20260806-094210.png"}, {"a": "summary", "n": "QQ20260806-094744.png", "u": "images/60_QQ20260806-094744.png"}]}, {"id": 61, "date": "8", "title": "第08天-06：指针运算", "topics": "指针运算", "summary": "", "codex": "【笔记名称】\n第08天-06：指针运算\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 指针运算\n\n【核心概念】\n本节核心是用地址间接访问数据。指针变量保存地址，* 用来读取或修改该地址中的值。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    int a[] = {10, 20, 30};\n    int *p = a;\n    for (size_t i = 0; i < 3; i++)\n        printf(\"%d \", *(p + i));\n    return 0;\n}\n\n【代码拆解】\n1. &value 取得变量地址，赋给类型匹配的指针。\n2. *p 是解引用；修改 *p 就是在修改原变量。\n3. 指针参与数组访问时，每次加 1 会前进一个元素。\n\n【容易踩坑】\n- 指针必须先指向有效对象；不要解引用 NULL、野指针或已经释放的地址。\n\n【一句话记忆】\n指针存地址，解引用取数据。", "code": "", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260806-101836.png", "u": "images/61_QQ20260806-101836.png"}]}, {"id": 50, "date": "7", "title": "第07天-03：数组大小", "topics": "数组大小", "summary": "", "codex": "【笔记名称】\n第07天-03：数组大小\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 数组大小\n\n【核心概念】\n数组大小把一组同类型数据按顺序保存。访问时要同时盯住容量、有效长度和结尾标记。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    int numbers[] = {10, 20, 30, 40};\n    size_t count = sizeof(numbers) / sizeof(numbers[0]);\n    printf(\"元素个数=%zu\\n\", count);\n    return 0;\n}\n\n【代码拆解】\n1. 数组下标从 0 开始，最后一个有效下标是元素个数减 1。\n2. 字符串本质是以 \\0 结束的 char 数组。\n3. 遍历条件应由实际长度或结束符控制。\n\n【容易踩坑】\n- 最常见错误是越界；字符串还要给结尾的 \\0 留一个字节。\n\n【一句话记忆】\n容量决定能放多少，长度决定现在用了多少。", "code": "", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260805-090319.png", "u": "images/50_QQ20260805-090319.png"}]}, {"id": 48, "date": "7", "title": "第07天-01：数组初试", "topics": "数组初试", "summary": "", "codex": "【笔记名称】\n第07天-01：数组初试\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 数组初试\n\n【核心概念】\n数组初试把一组同类型数据按顺序保存。访问时要同时盯住容量、有效长度和结尾标记。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    int scores[5] = {86, 92, 75, 88, 90};\n    int sum = 0;\n    for (size_t i = 0; i < 5; i++) sum += scores[i];\n    printf(\"平均分=%.1f\\n\", sum / 5.0);\n    return 0;\n}\n\n【代码拆解】\n1. 数组下标从 0 开始，最后一个有效下标是元素个数减 1。\n2. 字符串本质是以 \\0 结束的 char 数组。\n3. 遍历条件应由实际长度或结束符控制。\n\n【容易踩坑】\n- 最常见错误是越界；字符串还要给结尾的 \\0 留一个字节。\n\n【一句话记忆】\n容量决定能放多少，长度决定现在用了多少。", "code": "", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260805-083602.png", "u": "images/48_QQ20260805-083602.png"}]}, {"id": 49, "date": "7", "title": "第07天-02：数组定义", "topics": "数组定义", "summary": "", "codex": "【笔记名称】\n第07天-02：数组定义\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 数组定义\n\n【核心概念】\n数组定义把一组同类型数据按顺序保存。访问时要同时盯住容量、有效长度和结尾标记。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    int scores[5] = {86, 92, 75, 88, 90};\n    int sum = 0;\n    for (size_t i = 0; i < 5; i++) sum += scores[i];\n    printf(\"平均分=%.1f\\n\", sum / 5.0);\n    return 0;\n}\n\n【代码拆解】\n1. 数组下标从 0 开始，最后一个有效下标是元素个数减 1。\n2. 字符串本质是以 \\0 结束的 char 数组。\n3. 遍历条件应由实际长度或结束符控制。\n\n【容易踩坑】\n- 最常见错误是越界；字符串还要给结尾的 \\0 留一个字节。\n\n【一句话记忆】\n容量决定能放多少，长度决定现在用了多少。", "code": "", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260805-083809.png", "u": "images/49_QQ20260805-083809.png"}, {"a": "summary", "n": "QQ20260805-084132.png", "u": "images/49_QQ20260805-084132.png"}, {"a": "summary", "n": "QQ20260805-084542.png", "u": "images/49_QQ20260805-084542.png"}]}, {"id": 51, "date": "7", "title": "第07天-04：素数算法二", "topics": "素数算法二", "summary": "", "codex": "【笔记名称】\n第07天-04：素数算法二\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 素数算法二\n\n【核心概念】\n素数算法二的关键是确定循环变量如何开始、何时继续、每轮怎样变化，以及最终怎样退出。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    int n = 29, is_prime = n >= 2;\n    for (int i = 2; i * i <= n; i++) {\n        if (n % i == 0) { is_prime = 0; break; }\n    }\n    puts(is_prime ? \"是素数\" : \"不是素数\");\n    return 0;\n}\n\n【代码拆解】\n1. 循环前准备初始值。\n2. 循环条件只表达“还要不要继续”。\n3. 循环体完成一次工作并推进状态，避免死循环。\n\n【容易踩坑】\n- 先用最小值、0、负数和边界值手算几轮，再运行程序。\n\n【一句话记忆】\n循环就是：初始化—判断—执行—更新。", "code": "", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260805-093639.png", "u": "images/51_QQ20260805-093639.png"}]}, {"id": 52, "date": "7", "title": "第07天-05：二维数组", "topics": "二维数组", "summary": "", "codex": "【笔记名称】\n第07天-05：二维数组\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 二维数组\n\n【核心概念】\n二维数组把一组同类型数据按顺序保存。访问时要同时盯住容量、有效长度和结尾标记。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    int grid[2][3] = {{1, 2, 3}, {4, 5, 6}};\n    for (int r = 0; r < 2; r++) {\n        for (int c = 0; c < 3; c++) printf(\"%d \", grid[r][c]);\n        putchar('\\n');\n    }\n    return 0;\n}\n\n【代码拆解】\n1. 数组下标从 0 开始，最后一个有效下标是元素个数减 1。\n2. 字符串本质是以 \\0 结束的 char 数组。\n3. 遍历条件应由实际长度或结束符控制。\n\n【容易踩坑】\n- 最常见错误是越界；字符串还要给结尾的 \\0 留一个字节。\n\n【一句话记忆】\n容量决定能放多少，长度决定现在用了多少。", "code": "", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260805-094804.png", "u": "images/52_QQ20260805-094804.png"}, {"a": "summary", "n": "QQ20260805-094843.png", "u": "images/52_QQ20260805-094843.png"}, {"a": "summary", "n": "QQ20260805-094950.png", "u": "images/52_QQ20260805-094950.png"}]}, {"id": 38, "date": "6", "title": "第06天-01：逻辑运算", "topics": "逻辑运算", "summary": "", "codex": "【笔记名称】\n第06天-01：逻辑运算\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 逻辑运算\n\n【核心概念】\n逻辑运算负责让程序根据真假选择不同路径。C 中 0 为假，非 0 为真。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    int age = 20, has_id = 1;\n    printf(\"可进入：%d\\n\", age >= 18 && has_id);\n    printf(\"不满足：%d\\n\", !(age >= 18));\n    return 0;\n}\n\n【代码拆解】\n1. 先计算关系表达式，再得到 0 或 1。\n2. && 要求两边都真，|| 只需一边真，! 负责取反。\n3. 分支顺序要从更具体的条件写到更宽泛的条件。\n\n【容易踩坑】\n- 混用 = 与 ==、忘记括号或依赖复杂优先级都容易出错；复杂条件应主动加括号。\n\n【一句话记忆】\n条件算真假，分支选道路。", "code": "#include <stdio.h>\n\nint main(void)\n{\n    printf(\"Hello, C language!\\n\");\n    return 0;\n}\n", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260804-082013.png", "u": "images/38_QQ20260804-082013.png"}]}, {"id": 39, "date": "6", "title": "第06天-02：与或非运算", "topics": "与或非运算", "summary": "\n注意第三个！是单目运算符，优先级高于双目运算符\n", "codex": "【笔记名称】\n第06天-02：与或非运算\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 与或非运算\n\n【核心概念】\n本节学习“与或非运算”。先用一段最小程序验证语法，再观察每个变量在执行过程中的变化。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    int age = 20, has_id = 1;\n    printf(\"可进入：%d\\n\", age >= 18 && has_id);\n    printf(\"不满足：%d\\n\", !(age >= 18));\n    return 0;\n}\n\n【代码拆解】\n1. 从 main 函数入口开始阅读。\n2. 找出输入、核心处理和输出三部分。\n3. 修改一个值并预测结果，再编译验证。\n\n【容易踩坑】\n- 不要只背语法；每次至少运行一个正常值和一个边界值。\n\n【一句话记忆】\n先读懂数据怎么变，再记住语法怎么写。", "code": "#include <stdio.h>\n\nint main(void)\n{\n    printf(\"Hello, C language!\\n\");\n    return 0;\n}\n", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260804-082236.png", "u": "images/39_QQ20260804-082236.png"}, {"a": "summary", "n": "QQ20260804-082509.png", "u": "images/39_QQ20260804-082509.png"}, {"a": "summary", "n": "QQ20260804-082627.png", "u": "images/39_QQ20260804-082627.png"}]}, {"id": 40, "date": "6", "title": "第06天-04：逻辑短路", "topics": "逻辑短路", "summary": "", "codex": "【笔记名称】\n第06天-04：逻辑短路\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 逻辑短路\n\n【核心概念】\n逻辑短路负责让程序根据真假选择不同路径。C 中 0 为假，非 0 为真。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    int p = 0;\n    if (p != 0 && 100 / p > 2)\n        puts(\"成立\");\n    return 0;\n}\n\n【代码拆解】\n1. 先计算关系表达式，再得到 0 或 1。\n2. && 要求两边都真，|| 只需一边真，! 负责取反。\n3. 分支顺序要从更具体的条件写到更宽泛的条件。\n\n【容易踩坑】\n- 混用 = 与 ==、忘记括号或依赖复杂优先级都容易出错；复杂条件应主动加括号。\n\n【一句话记忆】\n条件算真假，分支选道路。", "code": "#include <stdio.h>\n\nint main(void)\n{\n    printf(\"Hello, C language!\\n\");\n    return 0;\n}\n", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260804-083026.png", "u": "images/40_QQ20260804-083026.png"}]}, {"id": 41, "date": "6", "title": "第06天-03：逻辑运算优先级", "topics": "逻辑运算优先级", "summary": "", "codex": "【笔记名称】\n第06天-03：逻辑运算优先级\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 逻辑运算优先级\n\n【核心概念】\n逻辑运算优先级负责让程序根据真假选择不同路径。C 中 0 为假，非 0 为真。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    int x = 2 + 3 * 4;\n    int y = (2 + 3) * 4;\n    printf(\"x=%d, y=%d\\n\", x, y);\n    return 0;\n}\n\n【代码拆解】\n1. 先计算关系表达式，再得到 0 或 1。\n2. && 要求两边都真，|| 只需一边真，! 负责取反。\n3. 分支顺序要从更具体的条件写到更宽泛的条件。\n\n【容易踩坑】\n- 混用 = 与 ==、忘记括号或依赖复杂优先级都容易出错；复杂条件应主动加括号。\n\n【一句话记忆】\n条件算真假，分支选道路。", "code": "#include <stdio.h>\n\nint main(void)\n{\n    printf(\"Hello, C language!\\n\");\n    return 0;\n}\n", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260804-082710.png", "u": "images/41_QQ20260804-082710.png"}]}, {"id": 42, "date": "6", "title": "第06天-05：条件运算符", "topics": "条件运算符", "summary": "", "codex": "【笔记名称】\n第06天-05：条件运算符\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 条件运算符\n\n【核心概念】\n条件运算符负责让程序根据真假选择不同路径。C 中 0 为假，非 0 为真。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    int a = 66, b = 12;\n    printf(\"和=%d 差=%d 积=%d 余数=%d\\n\",\n           a + b, a - b, a * b, a % b);\n    return 0;\n}\n\n【代码拆解】\n1. 先计算关系表达式，再得到 0 或 1。\n2. && 要求两边都真，|| 只需一边真，! 负责取反。\n3. 分支顺序要从更具体的条件写到更宽泛的条件。\n\n【容易踩坑】\n- 混用 = 与 ==、忘记括号或依赖复杂优先级都容易出错；复杂条件应主动加括号。\n\n【一句话记忆】\n条件算真假，分支选道路。", "code": "#include <stdio.h>\n\nint main(void)\n{\n    printf(\"Hello, C language!\\n\");\n    return 0;\n}\n", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260804-083223.png", "u": "images/42_QQ20260804-083223.png"}]}, {"id": 43, "date": "6", "title": "第06天-06：函数初见", "topics": "函数初见", "summary": "", "codex": "【笔记名称】\n第06天-06：函数初见\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 函数初见\n\n【核心概念】\n函数初见用于拆分职责和控制数据作用范围。函数应完成一件清楚的事，并通过参数接收输入、通过返回值或指针给出结果。\n\n【示例代码】\n#include <stdio.h>\n\nint add(int a, int b)\n{\n    return a + b;\n}\n\nint main(void)\n{\n    printf(\"%d\\n\", add(3, 5));\n    return 0;\n}\n\n【代码拆解】\n1. 声明告诉编译器函数长什么样。\n2. 调用时普通参数按值复制，修改副本不会改变原变量。\n3. 需要修改调用者数据时传入地址，并在函数内解引用。\n\n【容易踩坑】\n- 避免让函数依赖过多全局状态；变量应放在能够满足需求的最小作用域。\n\n【一句话记忆】\n参数传输入，返回值传结果，指针传可修改对象。", "code": "", "reflection": "", "imgs": []}, {"id": 44, "date": "6", "title": "第06天-07：函数定义", "topics": "函数定义", "summary": "", "codex": "【笔记名称】\n第06天-07：函数定义\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 函数定义\n\n【核心概念】\n函数定义用于拆分职责和控制数据作用范围。函数应完成一件清楚的事，并通过参数接收输入、通过返回值或指针给出结果。\n\n【示例代码】\n#include <stdio.h>\n\nint add(int a, int b)\n{\n    return a + b;\n}\n\nint main(void)\n{\n    printf(\"%d\\n\", add(3, 5));\n    return 0;\n}\n\n【代码拆解】\n1. 声明告诉编译器函数长什么样。\n2. 调用时普通参数按值复制，修改副本不会改变原变量。\n3. 需要修改调用者数据时传入地址，并在函数内解引用。\n\n【容易踩坑】\n- 避免让函数依赖过多全局状态；变量应放在能够满足需求的最小作用域。\n\n【一句话记忆】\n参数传输入，返回值传结果，指针传可修改对象。", "code": "", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260804-084349.png", "u": "images/44_QQ20260804-084349.png"}, {"a": "summary", "n": "QQ20260804-084611.png", "u": "images/44_QQ20260804-084611.png"}]}, {"id": 45, "date": "6", "title": "第06天-08：参数传递的毛病", "topics": "参数传递的毛病", "summary": "", "codex": "【笔记名称】\n第06天-08：参数传递的毛病\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 参数传递的毛病\n\n【核心概念】\n参数传递的毛病用于拆分职责和控制数据作用范围。函数应完成一件清楚的事，并通过参数接收输入、通过返回值或指针给出结果。\n\n【示例代码】\n#include <stdio.h>\n\nvoid swap(int *a, int *b)\n{\n    int temp = *a; *a = *b; *b = temp;\n}\n\nint main(void)\n{\n    int x = 3, y = 8;\n    swap(&x, &y);\n    printf(\"%d %d\\n\", x, y);\n    return 0;\n}\n\n【代码拆解】\n1. 声明告诉编译器函数长什么样。\n2. 调用时普通参数按值复制，修改副本不会改变原变量。\n3. 需要修改调用者数据时传入地址，并在函数内解引用。\n\n【容易踩坑】\n- 避免让函数依赖过多全局状态；变量应放在能够满足需求的最小作用域。\n\n【一句话记忆】\n参数传输入，返回值传结果，指针传可修改对象。", "code": "", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260804-091844.png", "u": "images/45_QQ20260804-091844.png"}]}, {"id": 46, "date": "6", "title": "第06天-09：本地变量的规则", "topics": "本地变量的规则", "summary": "", "codex": "【笔记名称】\n第06天-09：本地变量的规则\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 本地变量的规则\n\n【核心概念】\n本地变量的规则用于拆分职责和控制数据作用范围。函数应完成一件清楚的事，并通过参数接收输入、通过返回值或指针给出结果。\n\n【示例代码】\n#include <stdio.h>\n\nint global_count = 0;\nvoid visit(void)\n{\n    static int times = 0;\n    int local = 10;\n    printf(\"times=%d local=%d global=%d\\n\", ++times, local, ++global_count);\n}\nint main(void) { visit(); visit(); return 0; }\n\n【代码拆解】\n1. 声明告诉编译器函数长什么样。\n2. 调用时普通参数按值复制，修改副本不会改变原变量。\n3. 需要修改调用者数据时传入地址，并在函数内解引用。\n\n【容易踩坑】\n- 避免让函数依赖过多全局状态；变量应放在能够满足需求的最小作用域。\n\n【一句话记忆】\n参数传输入，返回值传结果，指针传可修改对象。", "code": "", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260804-092855.png", "u": "images/46_QQ20260804-092855.png"}]}, {"id": 31, "date": "5", "title": "第05天-01：数据类型", "topics": "数据类型", "summary": "今天学到：\n\n卡住的地方：\n\n明天复习：", "codex": "【笔记名称】\n第05天-01：数据类型\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 数据类型\n\n【核心概念】\n数据类型决定数据如何编码、占多少空间以及能表示什么范围。选择类型时应先看数据含义，再看范围和精度。\n\n【示例代码】\n#include <stdio.h>\n#include <limits.h>\n\nint main(void)\n{\n    printf(\"int占%zu字节，范围%d到%d\\n\",\n           sizeof(int), INT_MIN, INT_MAX);\n    return 0;\n}\n\n【代码拆解】\n1. sizeof 查看对象或类型占用的字节数。\n2. 整数运算会截断小数，浮点数通常只能近似表示十进制小数。\n3. 不同进制只是同一个整数的不同书写或显示方式。\n\n【容易踩坑】\n- 不要假设所有平台上的类型大小完全相同；格式符必须与实际类型对应。\n\n【一句话记忆】\n类型决定解释数据的方式。", "code": "#include <stdio.h>\n\nint main(void)\n{\n    printf(\"Hello, C language!\\n\");\n    return 0;\n}\n", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260803-091134.png", "u": "images/31_QQ20260803-091134.png"}, {"a": "summary", "n": "QQ20260803-091320.png", "u": "images/31_QQ20260803-091320.png"}, {"a": "summary", "n": "QQ20260803-091519.png", "u": "images/31_QQ20260803-091519.png"}, {"a": "summary", "n": "QQ20260803-091519.png", "u": "images/31_QQ20260803-091519_1.png"}]}, {"id": 32, "date": "5", "title": "第05天-02：整数类型", "topics": "整数类型", "summary": "", "codex": "【笔记名称】\n第05天-02：整数类型\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 整数类型\n\n【核心概念】\n整数类型决定数据如何编码、占多少空间以及能表示什么范围。选择类型时应先看数据含义，再看范围和精度。\n\n【示例代码】\n#include <stdio.h>\n#include <limits.h>\n\nint main(void)\n{\n    printf(\"int占%zu字节，范围%d到%d\\n\",\n           sizeof(int), INT_MIN, INT_MAX);\n    return 0;\n}\n\n【代码拆解】\n1. sizeof 查看对象或类型占用的字节数。\n2. 整数运算会截断小数，浮点数通常只能近似表示十进制小数。\n3. 不同进制只是同一个整数的不同书写或显示方式。\n\n【容易踩坑】\n- 不要假设所有平台上的类型大小完全相同；格式符必须与实际类型对应。\n\n【一句话记忆】\n类型决定解释数据的方式。", "code": "#include <stdio.h>\n\nint main(void)\n{\n    printf(\"Hello, C language!\\n\");\n    return 0;\n}\n", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260803-092343.png", "u": "images/32_QQ20260803-092343.png"}]}, {"id": 33, "date": "5", "title": "第05天-03：整数范围", "topics": "整数范围", "summary": "", "codex": "【笔记名称】\n第05天-03：整数范围\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 整数范围\n\n【核心概念】\n本节学习“整数范围”。先用一段最小程序验证语法，再观察每个变量在执行过程中的变化。\n\n【示例代码】\n#include <stdio.h>\n#include <limits.h>\n\nint main(void)\n{\n    printf(\"int占%zu字节，范围%d到%d\\n\",\n           sizeof(int), INT_MIN, INT_MAX);\n    return 0;\n}\n\n【代码拆解】\n1. 从 main 函数入口开始阅读。\n2. 找出输入、核心处理和输出三部分。\n3. 修改一个值并预测结果，再编译验证。\n\n【容易踩坑】\n- 不要只背语法；每次至少运行一个正常值和一个边界值。\n\n【一句话记忆】\n先读懂数据怎么变，再记住语法怎么写。", "code": "#include <stdio.h>\n\nint main(void)\n{\n    printf(\"Hello, C language!\\n\");\n    return 0;\n}\n", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260803-094204.png", "u": "images/33_QQ20260803-094204.png"}]}, {"id": 34, "date": "5", "title": "第05天-04：16进制和8进制", "topics": "16进制和8进制", "summary": "", "codex": "【笔记名称】\n第05天-04：16进制和8进制\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 16进制和8进制\n\n【核心概念】\n16进制和8进制决定数据如何编码、占多少空间以及能表示什么范围。选择类型时应先看数据含义，再看范围和精度。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    unsigned n = 26;\n    printf(\"十进制=%u 八进制=%o 十六进制=%X\\n\", n, n, n);\n    printf(\"最低位=%u\\n\", n & 1u);\n    return 0;\n}\n\n【代码拆解】\n1. sizeof 查看对象或类型占用的字节数。\n2. 整数运算会截断小数，浮点数通常只能近似表示十进制小数。\n3. 不同进制只是同一个整数的不同书写或显示方式。\n\n【容易踩坑】\n- 不要假设所有平台上的类型大小完全相同；格式符必须与实际类型对应。\n\n【一句话记忆】\n类型决定解释数据的方式。", "code": "#include <stdio.h>\n\nint main(void)\n{\n    printf(\"Hello, C language!\\n\");\n    return 0;\n}\n", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260803-095145.png", "u": "images/34_QQ20260803-095145.png"}]}, {"id": 35, "date": "5", "title": "第05天-05：浮点数", "topics": "浮点数", "summary": "今天学到：\n\n卡住的地方：\n\n明天复习：", "codex": "【笔记名称】\n第05天-05：浮点数\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 浮点数\n\n【核心概念】\n浮点数决定数据如何编码、占多少空间以及能表示什么范围。选择类型时应先看数据含义，再看范围和精度。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    double price = 12.5;\n    int count = 3;\n    printf(\"总价：%.2f\\n\", price * count);\n    return 0;\n}\n\n【代码拆解】\n1. sizeof 查看对象或类型占用的字节数。\n2. 整数运算会截断小数，浮点数通常只能近似表示十进制小数。\n3. 不同进制只是同一个整数的不同书写或显示方式。\n\n【容易踩坑】\n- 不要假设所有平台上的类型大小完全相同；格式符必须与实际类型对应。\n\n【一句话记忆】\n类型决定解释数据的方式。", "code": "#include <stdio.h>\n\nint main(void)\n{\n    printf(\"Hello, C language!\\n\");\n    return 0;\n}\n", "reflection": "", "imgs": []}, {"id": 36, "date": "5", "title": "第05天-06：字符", "topics": "字符", "summary": "", "codex": "【笔记名称】\n第05天-06：字符\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 字符\n\n【核心概念】\n字符决定数据如何编码、占多少空间以及能表示什么范围。选择类型时应先看数据含义，再看范围和精度。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    char grade = 'A';\n    printf(\"字符：%c\\n制表符：\\t路径：C:\\\\temp\\n\", grade);\n    return 0;\n}\n\n【代码拆解】\n1. sizeof 查看对象或类型占用的字节数。\n2. 整数运算会截断小数，浮点数通常只能近似表示十进制小数。\n3. 不同进制只是同一个整数的不同书写或显示方式。\n\n【容易踩坑】\n- 不要假设所有平台上的类型大小完全相同；格式符必须与实际类型对应。\n\n【一句话记忆】\n类型决定解释数据的方式。", "code": "#include <stdio.h>\n\nint main(void)\n{\n    printf(\"Hello, C language!\\n\");\n    return 0;\n}\n", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260803-103000.png", "u": "images/36_QQ20260803-103000.png"}, {"a": "summary", "n": "QQ20260803-103455.png", "u": "images/36_QQ20260803-103455.png"}]}, {"id": 37, "date": "5", "title": "第05天-07：逃逸字符", "topics": "逃逸字符", "summary": "", "codex": "【笔记名称】\n第05天-07：逃逸字符\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 逃逸字符\n\n【核心概念】\n逃逸字符决定数据如何编码、占多少空间以及能表示什么范围。选择类型时应先看数据含义，再看范围和精度。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    char grade = 'A';\n    printf(\"字符：%c\\n制表符：\\t路径：C:\\\\temp\\n\", grade);\n    return 0;\n}\n\n【代码拆解】\n1. sizeof 查看对象或类型占用的字节数。\n2. 整数运算会截断小数，浮点数通常只能近似表示十进制小数。\n3. 不同进制只是同一个整数的不同书写或显示方式。\n\n【容易踩坑】\n- 不要假设所有平台上的类型大小完全相同；格式符必须与实际类型对应。\n\n【一句话记忆】\n类型决定解释数据的方式。", "code": "#include <stdio.h>\n\nint main(void)\n{\n    printf(\"Hello, C language!\\n\");\n    return 0;\n}\n", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260803-103843.png", "u": "images/37_QQ20260803-103843.png"}, {"a": "summary", "n": "QQ20260803-103929.png", "u": "images/37_QQ20260803-103929.png"}]}, {"id": 28, "date": "4", "title": "第04天-05：水仙花数", "topics": "水仙花数", "summary": "今天学到：\n\n卡住的地方：\n\n明天复习：", "codex": "【笔记名称】\n第04天-05：水仙花数\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 水仙花数\n\n【核心概念】\n水仙花数的关键是确定循环变量如何开始、何时继续、每轮怎样变化，以及最终怎样退出。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    for (int n = 100; n <= 999; n++) {\n        int a = n / 100, b = n / 10 % 10, c = n % 10;\n        if (a*a*a + b*b*b + c*c*c == n)\n            printf(\"%d \", n);\n    }\n    return 0;\n}\n\n【代码拆解】\n1. 循环前准备初始值。\n2. 循环条件只表达“还要不要继续”。\n3. 循环体完成一次工作并推进状态，避免死循环。\n\n【容易踩坑】\n- 先用最小值、0、负数和边界值手算几轮，再运行程序。\n\n【一句话记忆】\n循环就是：初始化—判断—执行—更新。", "code": "#include <stdio.h>\n\nint main(void)\n{\n    printf(\"Hello, C language!\\n\");\n    return 0;\n}\n", "reflection": "", "imgs": []}, {"id": 24, "date": "4", "title": "第04天-01：整数分解之一", "topics": "整数分解之一", "summary": "今天学到：\n\n卡住的地方：\n\n明天复习：", "codex": "【笔记名称】\n第04天-01：整数分解之一\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 整数分解之一\n\n【核心概念】\n整数分解之一的关键是确定循环变量如何开始、何时继续、每轮怎样变化，以及最终怎样退出。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    int n = 13425, mask = 10000;\n    while (mask > 0) {\n        printf(\"%d \", n / mask);\n        n %= mask;\n        mask /= 10;\n    }\n    return 0;\n}\n\n【代码拆解】\n1. 循环前准备初始值。\n2. 循环条件只表达“还要不要继续”。\n3. 循环体完成一次工作并推进状态，避免死循环。\n\n【容易踩坑】\n- 先用最小值、0、负数和边界值手算几轮，再运行程序。\n\n【一句话记忆】\n循环就是：初始化—判断—执行—更新。", "code": "#include <stdio.h>\n\nint main()\n{\n    int x;\n    scanf(\"%d\", &x);\n\n    x = 13425;\n    int cnt = 0;\n    do {\n        x /= 10;\n        cnt++;\n    } while (x > 0);\n\n    printf(\"cnt=%d\\n\", cnt);\n\n    int mask = 10000;\n    do {\n        int d = x / mask;\n        printf(\"%d\", d);\n        if (mask > 9) {\n            printf(\" \");\n        }\n        x %= mask;\n        mask /= 10;\n    } while (mask > 0);\n}", "reflection": "", "imgs": []}, {"id": 27, "date": "4", "title": "第04天-02：整数分解之二", "topics": "整数分解之二", "summary": "今天学到：\n\n卡住的地方：\n\n明天复习：", "codex": "【笔记名称】\n第04天-02：整数分解之二\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 整数分解之二\n\n【核心概念】\n整数分解之二的关键是确定循环变量如何开始、何时继续、每轮怎样变化，以及最终怎样退出。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    int n = 13425, mask = 10000;\n    while (mask > 0) {\n        printf(\"%d \", n / mask);\n        n %= mask;\n        mask /= 10;\n    }\n    return 0;\n}\n\n【代码拆解】\n1. 循环前准备初始值。\n2. 循环条件只表达“还要不要继续”。\n3. 循环体完成一次工作并推进状态，避免死循环。\n\n【容易踩坑】\n- 先用最小值、0、负数和边界值手算几轮，再运行程序。\n\n【一句话记忆】\n循环就是：初始化—判断—执行—更新。", "code": "#include <stdio.h>\n\nint main()\n{\n    int x;\n    scanf(\"%d\", &x);\n\n    x = 13425;\n    int cnt = 0;\n    do {\n        x /= 10;\n        cnt++;\n    } while (x > 0);\n\n    printf(\"cnt=%d\\n\", cnt);\n\n    int mask = 10000;\n    do {\n        int d = x / mask;\n        printf(\"%d\", d);\n        if (mask > 9) {\n            printf(\" \");\n        }\n        x %= mask;\n        mask /= 10;\n    } while (mask > 0);\n}", "reflection": "", "imgs": []}, {"id": 29, "date": "4", "title": "第04天-03：最大公约数", "topics": "最大公约数", "summary": "今天学到：\n\n卡住的地方：\n\n明天复习：", "codex": "【笔记名称】\n第04天-03：最大公约数\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 最大公约数\n\n【核心概念】\n最大公约数的关键是确定循环变量如何开始、何时继续、每轮怎样变化，以及最终怎样退出。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    int a = 48, b = 18;\n    while (b != 0) {\n        int r = a % b;\n        a = b;\n        b = r;\n    }\n    printf(\"最大公约数=%d\\n\", a);\n    return 0;\n}\n\n【代码拆解】\n1. 循环前准备初始值。\n2. 循环条件只表达“还要不要继续”。\n3. 循环体完成一次工作并推进状态，避免死循环。\n\n【容易踩坑】\n- 先用最小值、0、负数和边界值手算几轮，再运行程序。\n\n【一句话记忆】\n循环就是：初始化—判断—执行—更新。", "code": "#include <stdio.h>\n\nint main(void)\n{\n    printf(\"Hello, C language!\\n\");\n    return 0;\n}\n", "reflection": "", "imgs": []}, {"id": 30, "date": "4", "title": "第04天-04：辗转相除法公约数", "topics": "辗转相除法公约数", "summary": "今天学到：\n\n卡住的地方：\n\n明天复习：", "codex": "【笔记名称】\n第04天-04：辗转相除法公约数\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 辗转相除法公约数\n\n【核心概念】\n辗转相除法公约数的关键是确定循环变量如何开始、何时继续、每轮怎样变化，以及最终怎样退出。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    int a = 48, b = 18;\n    while (b != 0) {\n        int r = a % b;\n        a = b;\n        b = r;\n    }\n    printf(\"最大公约数=%d\\n\", a);\n    return 0;\n}\n\n【代码拆解】\n1. 循环前准备初始值。\n2. 循环条件只表达“还要不要继续”。\n3. 循环体完成一次工作并推进状态，避免死循环。\n\n【容易踩坑】\n- 先用最小值、0、负数和边界值手算几轮，再运行程序。\n\n【一句话记忆】\n循环就是：初始化—判断—执行—更新。", "code": "#include <stdio.h>\n\nint main(void)\n{\n    printf(\"Hello, C language!\\n\");\n    return 0;\n}\n", "reflection": "", "imgs": []}, {"id": 9, "date": "3", "title": "第03天-01：随机数以及猜数游戏", "topics": "随机数以及猜数游戏", "summary": "", "codex": "【笔记名称】\n第03天-01：随机数以及猜数游戏\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 随机数以及猜数游戏\n\n【核心概念】\n随机数以及猜数游戏的关键是确定循环变量如何开始、何时继续、每轮怎样变化，以及最终怎样退出。\n\n【示例代码】\n#include <stdio.h>\n#include <stdlib.h>\n#include <time.h>\n\nint main(void)\n{\n    srand((unsigned)time(NULL));\n    int answer = rand() % 100 + 1, guess;\n    do {\n        scanf(\"%d\", &guess);\n        if (guess < answer) puts(\"小了\");\n        else if (guess > answer) puts(\"大了\");\n    } while (guess != answer);\n    puts(\"猜对了\");\n    return 0;\n}\n\n【代码拆解】\n1. 循环前准备初始值。\n2. 循环条件只表达“还要不要继续”。\n3. 循环体完成一次工作并推进状态，避免死循环。\n\n【容易踩坑】\n- 先用最小值、0、负数和边界值手算几轮，再运行程序。\n\n【一句话记忆】\n循环就是：初始化—判断—执行—更新。", "code": "int main()\n{\n    srand(time(0));\n    int a= rand()%100+1;\n    int number;\n    do {scanf(\"%d\", &number);\n        if(a > number){printf(\"猜小了\\n\");}\n        else if(a < number){printf(\"猜大了\\n\");}\n        \n\n    } while (a != number); \n    printf(\"乐乐，恭喜你猜对了\\n\");\n}", "reflection": "", "imgs": []}, {"id": 18, "date": "3", "title": "第03天-02：求和", "topics": "求和", "summary": "今天学到：\n\n卡住的地方：\n\n明天复习：", "codex": "【笔记名称】\n第03天-02：求和\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 求和\n\n【核心概念】\n求和的关键是确定循环变量如何开始、何时继续、每轮怎样变化，以及最终怎样退出。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    int n, sum = 0;\n    while (scanf(\"%d\", &n) == 1 && n != -1)\n        sum += n;\n    printf(\"sum=%d\\n\", sum);\n    return 0;\n}\n\n【代码拆解】\n1. 循环前准备初始值。\n2. 循环条件只表达“还要不要继续”。\n3. 循环体完成一次工作并推进状态，避免死循环。\n\n【容易踩坑】\n- 先用最小值、0、负数和边界值手算几轮，再运行程序。\n\n【一句话记忆】\n循环就是：初始化—判断—执行—更新。", "code": "int main()\n{\n    int n;\n    int sum=0;\n    int i=0;\n    do{ scanf(\"%d\", &n);\n        sum += n;\n        i++;\n    } while (n != -1);\n    printf(\"%d\\n\", sum+=1);\n    printf(\"%lf\\n\", 1.0*sum/i);\n    return 0;\n}", "reflection": "", "imgs": []}, {"id": 19, "date": "3", "title": "第03天-04：for循环", "topics": "for循环", "summary": "\n第一个条件是初始动作\n第二，循环继续的条件\n第三，循环要做的动作", "codex": "【笔记名称】\n第03天-04：for循环\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · for循环\n\n【核心概念】\nfor循环的关键是确定循环变量如何开始、何时继续、每轮怎样变化，以及最终怎样退出。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    for (int i = 1; i <= 5; i++)\n        printf(\"%d \", i);\n    return 0;\n}\n\n【代码拆解】\n1. 循环前准备初始值。\n2. 循环条件只表达“还要不要继续”。\n3. 循环体完成一次工作并推进状态，避免死循环。\n\n【容易踩坑】\n- 先用最小值、0、负数和边界值手算几轮，再运行程序。\n\n【一句话记忆】\n循环就是：初始化—判断—执行—更新。", "code": "#include <stdio.h>\n\nint main(void)\n{\n    printf(\"Hello, C language!\\n\");\n    return 0;\n}\n", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260801-095857.png", "u": "images/19_QQ20260801-095857.png"}, {"a": "summary", "n": "QQ20260801-100352.png", "u": "images/19_QQ20260801-100352.png"}]}, {"id": 20, "date": "3", "title": "第03天-03：整数翻转", "topics": "整数翻转", "summary": "", "codex": "【笔记名称】\n第03天-03：整数翻转\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 整数翻转\n\n【核心概念】\n整数翻转的关键是确定循环变量如何开始、何时继续、每轮怎样变化，以及最终怎样退出。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    int n = 12345, reversed = 0;\n    while (n != 0) {\n        reversed = reversed * 10 + n % 10;\n        n /= 10;\n    }\n    printf(\"%d\\n\", reversed);\n    return 0;\n}\n\n【代码拆解】\n1. 循环前准备初始值。\n2. 循环条件只表达“还要不要继续”。\n3. 循环体完成一次工作并推进状态，避免死循环。\n\n【容易踩坑】\n- 先用最小值、0、负数和边界值手算几轮，再运行程序。\n\n【一句话记忆】\n循环就是：初始化—判断—执行—更新。", "code": "#include <stdio.h>\nint main(void)\n{\n    long long chushi;\n    long long zhongzhuan;\n    long long fanzhuan = 0;\n    scanf(\"%lld\", &chushi);\n\n    while (chushi != 0)\n    {\n        zhongzhuan = chushi % 10;\n\n        fanzhuan = fanzhuan * 10 + zhongzhuan;\n\n        chushi = chushi / 10;\n    }\n    printf(\"%lld\\n\", fanzhuan);\n}\n", "reflection": "", "imgs": []}, {"id": 21, "date": "3", "title": "第03天-05：阶乘和for,while的关系", "topics": "阶乘和for,while的关系", "summary": "", "codex": "【笔记名称】\n第03天-05：阶乘和for,while的关系\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 阶乘和for,while的关系\n\n【核心概念】\n阶乘和for,while的关系的关键是确定循环变量如何开始、何时继续、每轮怎样变化，以及最终怎样退出。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    int n = 5;\n    long long result = 1;\n    for (int i = 2; i <= n; i++)\n        result *= i;\n    printf(\"%d! = %lld\\n\", n, result);\n    return 0;\n}\n\n【代码拆解】\n1. 循环前准备初始值。\n2. 循环条件只表达“还要不要继续”。\n3. 循环体完成一次工作并推进状态，避免死循环。\n\n【容易踩坑】\n- 先用最小值、0、负数和边界值手算几轮，再运行程序。\n\n【一句话记忆】\n循环就是：初始化—判断—执行—更新。", "code": "#include <stdio.h>\n\nint main()\n{\n    int n;\n\n    scanf(\"%d\", &n);\n    int fact = 1;\n\n    int i = 1;\n\n    // for (i = 1; i <= n; i++) {\n    //     fact *= i;\n    // }\n\n    for (i = n; i > 1; i--) {\n        fact *= i;\n    }\n\n    printf(\"%d!=%d\\n\", n, fact);\n\n    return 0;\n}", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260801-101326.png", "u": "images/21_QQ20260801-101326.png"}, {"a": "summary", "n": "QQ20260801-101520.png", "u": "images/21_QQ20260801-101520.png"}]}, {"id": 22, "date": "3", "title": "第03天-06：循环控制", "topics": "循环控制", "summary": "", "codex": "【笔记名称】\n第03天-06：循环控制\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 循环控制\n\n【核心概念】\n循环控制的关键是确定循环变量如何开始、何时继续、每轮怎样变化，以及最终怎样退出。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    int n = 29, is_prime = n >= 2;\n    for (int i = 2; i * i <= n; i++) {\n        if (n % i == 0) { is_prime = 0; break; }\n    }\n    puts(is_prime ? \"是素数\" : \"不是素数\");\n    return 0;\n}\n\n【代码拆解】\n1. 循环前准备初始值。\n2. 循环条件只表达“还要不要继续”。\n3. 循环体完成一次工作并推进状态，避免死循环。\n\n【容易踩坑】\n- 先用最小值、0、负数和边界值手算几轮，再运行程序。\n\n【一句话记忆】\n循环就是：初始化—判断—执行—更新。", "code": "#include <stdio.h>\n\nint main()\n{\n    int x;\n\n    scanf(\"%d\", &x);\n\n    int i;\n    int isPrime = 1;  // 假设 x 是素数\n\n    for (i = 2; i < x; i++) {\n        if (x % i == 0) {\n            isPrime = 0;\n        }\n    }\n\n    if (isPrime == 1) {\n        printf(\"是素数\\n\");\n    } else {\n        printf(\"不是素数\\n\");\n    }\n\n    return 0;\n}", "reflection": "", "imgs": []}, {"id": 23, "date": "3", "title": "第03天-07：goto加嵌套算钱", "topics": "goto加嵌套算钱", "summary": "今天学到：\n\n卡住的地方：\n\n明天复习：", "codex": "【笔记名称】\n第03天-07：goto加嵌套算钱\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · goto加嵌套算钱\n\n【核心概念】\n本节学习“goto加嵌套算钱”。先用一段最小程序验证语法，再观察每个变量在执行过程中的变化。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    for (int a = 1; a <= 10; a++) {\n        for (int b = 1; b <= 10; b++) {\n            if (a + b == 10) {\n                printf(\"a=%d b=%d\\n\", a, b);\n                return 0;  // 找到后直接结束\n            }\n        }\n    }\n    return 0;\n}\n\n【代码拆解】\n1. 从 main 函数入口开始阅读。\n2. 找出输入、核心处理和输出三部分。\n3. 修改一个值并预测结果，再编译验证。\n\n【容易踩坑】\n- 不要只背语法；每次至少运行一个正常值和一个边界值。\n\n【一句话记忆】\n先读懂数据怎么变，再记住语法怎么写。", "code": "#include <stdio.h>\n\nint main()\n{\n    int x;\n    int one, two, five;\n\n    scanf(\"%d\", &x);\n\n    for (one = 1; one < x * 10; one++) {\n        for (two = 1; two < x * 10 / 2; two++) {\n            for (five = 1; five < x * 10 / 5; five++) {\n                if (one + two * 2 + five * 5 == x * 10) {\n                    printf(\"可以用%d个1角加%d个2角加%d个5角得到%d元\\n\",one, two, five, x);\n                    goto out;\n                }\n            }\n        }\n    }\n\nout:\n    return 0;\n}", "reflection": "", "imgs": []}, {"id": 10, "date": "2", "title": "第02天-01：if条件判断", "topics": "if条件判断", "summary": "", "codex": "【笔记名称】\n第02天-01：if条件判断\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · if条件判断\n\n【核心概念】\nif条件判断负责让程序根据真假选择不同路径。C 中 0 为假，非 0 为真。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    int score;\n    scanf(\"%d\", &score);\n    if (score >= 90) printf(\"优秀\\n\");\n    else if (score >= 60) printf(\"及格\\n\");\n    else printf(\"继续努力\\n\");\n    return 0;\n}\n\n【代码拆解】\n1. 先计算关系表达式，再得到 0 或 1。\n2. && 要求两边都真，|| 只需一边真，! 负责取反。\n3. 分支顺序要从更具体的条件写到更宽泛的条件。\n\n【容易踩坑】\n- 混用 = 与 ==、忘记括号或依赖复杂优先级都容易出错；复杂条件应主动加括号。\n\n【一句话记忆】\n条件算真假，分支选道路。", "code": "#include <stdio.h>\n\nint main(void)\n{\n    printf(\"Hello, C language!\\n\");\n    return 0;\n}\n", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260731-091044.png", "u": "images/10_QQ20260731-091044.png"}]}, {"id": 11, "date": "2", "title": "第02天-02：条件判断优先级", "topics": "条件判断优先级", "summary": "", "codex": "【笔记名称】\n第02天-02：条件判断优先级\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 条件判断优先级\n\n【核心概念】\n条件判断优先级负责让程序根据真假选择不同路径。C 中 0 为假，非 0 为真。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    int x = 2 + 3 * 4;\n    int y = (2 + 3) * 4;\n    printf(\"x=%d, y=%d\\n\", x, y);\n    return 0;\n}\n\n【代码拆解】\n1. 先计算关系表达式，再得到 0 或 1。\n2. && 要求两边都真，|| 只需一边真，! 负责取反。\n3. 分支顺序要从更具体的条件写到更宽泛的条件。\n\n【容易踩坑】\n- 混用 = 与 ==、忘记括号或依赖复杂优先级都容易出错；复杂条件应主动加括号。\n\n【一句话记忆】\n条件算真假，分支选道路。", "code": "#include <stdio.h>\n\nint main(void)\n{\n    printf(\"Hello, C language!\\n\");\n    return 0;\n}\n", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260731-092044.png", "u": "images/11_QQ20260731-092044.png"}, {"a": "summary", "n": "QQ20260731-092151.png", "u": "images/11_QQ20260731-092151.png"}]}, {"id": 12, "date": "2", "title": "第02天-03：注释", "topics": "注释", "summary": "", "codex": "【笔记名称】\n第02天-03：注释\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 注释\n\n【核心概念】\n本节学习“注释”。先用一段最小程序验证语法，再观察每个变量在执行过程中的变化。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    // 单行注释：说明下一行为什么这样写\n    int score = 90;\n    /* 多行注释：适合较长说明 */\n    printf(\"%d\\n\", score);\n    return 0;\n}\n\n【代码拆解】\n1. 从 main 函数入口开始阅读。\n2. 找出输入、核心处理和输出三部分。\n3. 修改一个值并预测结果，再编译验证。\n\n【容易踩坑】\n- 不要只背语法；每次至少运行一个正常值和一个边界值。\n\n【一句话记忆】\n先读懂数据怎么变，再记住语法怎么写。", "code": "#include <stdio.h>\n\nint main(void)\n{\n    printf(\"Hello, C language!\\n\");\n    return 0;\n}\n", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260731-092420.png", "u": "images/12_QQ20260731-092420.png"}]}, {"id": 13, "date": "2", "title": "第02天-04：if和else", "topics": "if和else", "summary": "", "codex": "【笔记名称】\n第02天-04：if和else\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · if和else\n\n【核心概念】\nif和else负责让程序根据真假选择不同路径。C 中 0 为假，非 0 为真。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    int score;\n    scanf(\"%d\", &score);\n    if (score >= 90) printf(\"优秀\\n\");\n    else if (score >= 60) printf(\"及格\\n\");\n    else printf(\"继续努力\\n\");\n    return 0;\n}\n\n【代码拆解】\n1. 先计算关系表达式，再得到 0 或 1。\n2. && 要求两边都真，|| 只需一边真，! 负责取反。\n3. 分支顺序要从更具体的条件写到更宽泛的条件。\n\n【容易踩坑】\n- 混用 = 与 ==、忘记括号或依赖复杂优先级都容易出错；复杂条件应主动加括号。\n\n【一句话记忆】\n条件算真假，分支选道路。", "code": "#include <stdio.h>\n    int main(void)\n{\n    int money,bill;\n    money = 0;\n    bill = 0;\n    printf(\"请输入您有的金额：\");\n    scanf(\"%d\", &money);\n    printf(\"请输入您要支付的金额：\");\n    scanf(\"%d\", &bill);\n    if (money >= bill)\n    {\n        printf(\"支付成功，找零%d元。\\n\", money - bill);\n    }\n    else\n    {\n        printf(\"支付失败，余额不足。\\n\");\n    }\n}", "reflection": "", "imgs": []}, {"id": 14, "date": "2", "title": "第02天-05：级联 else if", "topics": "级联 else if", "summary": "", "codex": "【笔记名称】\n第02天-05：级联 else if\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 级联 else if\n\n【核心概念】\n级联 else if负责让程序根据真假选择不同路径。C 中 0 为假，非 0 为真。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    int score;\n    scanf(\"%d\", &score);\n    if (score >= 90) printf(\"优秀\\n\");\n    else if (score >= 60) printf(\"及格\\n\");\n    else printf(\"继续努力\\n\");\n    return 0;\n}\n\n【代码拆解】\n1. 先计算关系表达式，再得到 0 或 1。\n2. && 要求两边都真，|| 只需一边真，! 负责取反。\n3. 分支顺序要从更具体的条件写到更宽泛的条件。\n\n【容易踩坑】\n- 混用 = 与 ==、忘记括号或依赖复杂优先级都容易出错；复杂条件应主动加括号。\n\n【一句话记忆】\n条件算真假，分支选道路。", "code": "#include <stdio.h>\nint main(void)\n{\n    int x;\n    scanf(\"%d\", &x);\n    int f = 0;\n    if(x<0)\n    f=-1;\n    else if(x==0)\n    f=0;\n    else\n    f=x*2;\n    printf(\"f = %d\\n\", f);\n    return 0;\n}", "reflection": "", "imgs": []}, {"id": 16, "date": "2", "title": "第02天-06：switch case", "topics": "switch case", "summary": "", "codex": "【笔记名称】\n第02天-06：switch case\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · switch case\n\n【核心概念】\nswitch case负责让程序根据真假选择不同路径。C 中 0 为假，非 0 为真。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    int choice = 2;\n    switch (choice) {\n    case 1: printf(\"开始\\n\"); break;\n    case 2: printf(\"设置\\n\"); break;\n    default: printf(\"无效选项\\n\");\n    }\n    return 0;\n}\n\n【代码拆解】\n1. 先计算关系表达式，再得到 0 或 1。\n2. && 要求两边都真，|| 只需一边真，! 负责取反。\n3. 分支顺序要从更具体的条件写到更宽泛的条件。\n\n【容易踩坑】\n- 混用 = 与 ==、忘记括号或依赖复杂优先级都容易出错；复杂条件应主动加括号。\n\n【一句话记忆】\n条件算真假，分支选道路。", "code": "#include <stdio.h>\n\nint main(void)\n{\n    printf(\"Hello, C language!\\n\");\n    return 0;\n}\n", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260731-111102.png", "u": "images/16_QQ20260731-111102.png"}]}, {"id": 17, "date": "2", "title": "第02天-07：do while循环", "topics": "do while循环", "summary": "今天学到：\n\n卡住的地方：\n\n明天复习：", "codex": "【笔记名称】\n第02天-07：do while循环\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · do while循环\n\n【核心概念】\ndo while循环的关键是确定循环变量如何开始、何时继续、每轮怎样变化，以及最终怎样退出。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    int n = 3;\n    do {\n        printf(\"%d \", n);\n        n--;\n    } while (n > 0);\n    return 0;\n}\n\n【代码拆解】\n1. 循环前准备初始值。\n2. 循环条件只表达“还要不要继续”。\n3. 循环体完成一次工作并推进状态，避免死循环。\n\n【容易踩坑】\n- 先用最小值、0、负数和边界值手算几轮，再运行程序。\n\n【一句话记忆】\n循环就是：初始化—判断—执行—更新。", "code": "#include <stdio.h>\n\nint main(void)\n{\n    int x;\n    int n = 0;\n\n    scanf(\"%d\", &x);\n\n    do\n    {\n        n++;\n        x /= 10;\n    } while (x != 0);\n\n    printf(\"%d\\n\", n);\n\n    return 0;\n}", "reflection": "", "imgs": []}, {"id": 5, "date": "1", "title": "第01天-03：浮点数", "topics": "浮点数", "summary": "%f 浮点数，带小数的玩意\n浮点数也分两种，单精度和双精度\n但是输入的话的要这样scanf（“lf%，&foot）；\n\n", "codex": "【笔记名称】\n第01天-03：浮点数\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 浮点数\n\n【核心概念】\n浮点数决定数据如何编码、占多少空间以及能表示什么范围。选择类型时应先看数据含义，再看范围和精度。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    double price = 12.5;\n    int count = 3;\n    printf(\"总价：%.2f\\n\", price * count);\n    return 0;\n}\n\n【代码拆解】\n1. sizeof 查看对象或类型占用的字节数。\n2. 整数运算会截断小数，浮点数通常只能近似表示十进制小数。\n3. 不同进制只是同一个整数的不同书写或显示方式。\n\n【容易踩坑】\n- 不要假设所有平台上的类型大小完全相同；格式符必须与实际类型对应。\n\n【一句话记忆】\n类型决定解释数据的方式。", "code": "#include <stdio.h>\n\nint main(void)\n{\n    printf(\"Hello, C language!\\n\");\n    return 0;\n}\n", "reflection": "%f 浮点数，带小数的玩意", "imgs": [{"a": "summary", "n": "QQ20260730-155517.png", "u": "images/5_QQ20260730-155517.png"}, {"a": "summary", "n": "QQ20260730-155907.png", "u": "images/5_QQ20260730-155907.png"}]}, {"id": 1, "date": "1", "title": "第01天-01：计算", "topics": "计算", "summary": "今天学到：做点计算\n%d的百分号d的意思是我把这个词填到后面去。后头的值要用逗号隔开。\n\n", "codex": "【笔记名称】\n第01天-01：计算\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 计算\n\n【核心概念】\n本节学习“计算”。先用一段最小程序验证语法，再观察每个变量在执行过程中的变化。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    int a = 66, b = 12;\n    printf(\"和=%d 差=%d 积=%d 余数=%d\\n\",\n           a + b, a - b, a * b, a % b);\n    return 0;\n}\n\n【代码拆解】\n1. 从 main 函数入口开始阅读。\n2. 找出输入、核心处理和输出三部分。\n3. 修改一个值并预测结果，再编译验证。\n\n【容易踩坑】\n- 不要只背语法；每次至少运行一个正常值和一个边界值。\n\n【一句话记忆】\n先读懂数据怎么变，再记住语法怎么写。", "code": "#include <stdio.h>\nint main(void)\n{\n    printf(\"66+66=%d\", 66 + 66);\n    return 0;\n}", "reflection": "#include <stdio.h>\n\nint main(void)\n{\n    int price = 0;\n    int amount = 0;\n\n    printf(\"请输入价格：\");\n    fflush(stdout);\n\n    if (scanf(\"%d\", &price) != 1) {\n        printf(\"输入错误，请输入整数。\\n\");\n        return 1;\n    }\n\n    printf(\"请输入你的钱：\");\n    fflush(stdout);\n\n    if (scanf(\"%d\", &amount) != 1) {\n        printf(\"输入错误，请输入整数。\\n\");\n        return 1;\n    }\n\n    if (amount < price) {\n        printf(\"金额不足，还差：%d\\n\", price - amount);", "imgs": []}, {"id": 4, "date": "1", "title": "第01天-02：复杂计算", "topics": "复杂计算", "summary": "const 是常量\n", "codex": "【笔记名称】\n第01天-02：复杂计算\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 复杂计算\n\n【核心概念】\n本节学习“复杂计算”。先用一段最小程序验证语法，再观察每个变量在执行过程中的变化。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    int a = 66, b = 12;\n    printf(\"和=%d 差=%d 积=%d 余数=%d\\n\",\n           a + b, a - b, a * b, a % b);\n    return 0;\n}\n\n【代码拆解】\n1. 从 main 函数入口开始阅读。\n2. 找出输入、核心处理和输出三部分。\n3. 修改一个值并预测结果，再编译验证。\n\n【容易踩坑】\n- 不要只背语法；每次至少运行一个正常值和一个边界值。\n\n【一句话记忆】\n先读懂数据怎么变，再记住语法怎么写。", "code": "#include <stdio.h>\nint main(void)\n{\n    printf(\"66+66=%d\", 66 + 66);\n    return 0;\n}", "reflection": "不知道\n", "imgs": [{"a": "summary", "n": "变量.png", "u": "images/4_变量_2.png"}]}, {"id": 6, "date": "1", "title": "第01天-04：运算符", "topics": "运算符", "summary": "\n", "codex": "【笔记名称】\n第01天-04：运算符\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 运算符\n\n【核心概念】\n本节学习“运算符”。先用一段最小程序验证语法，再观察每个变量在执行过程中的变化。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    int a = 66, b = 12;\n    printf(\"和=%d 差=%d 积=%d 余数=%d\\n\",\n           a + b, a - b, a * b, a % b);\n    return 0;\n}\n\n【代码拆解】\n1. 从 main 函数入口开始阅读。\n2. 找出输入、核心处理和输出三部分。\n3. 修改一个值并预测结果，再编译验证。\n\n【容易踩坑】\n- 不要只背语法；每次至少运行一个正常值和一个边界值。\n\n【一句话记忆】\n先读懂数据怎么变，再记住语法怎么写。", "code": "int hour1, minute1;\nint hour2, minute2;\n\nscanf(\"%d %d\", &hour1, &minute1);\nscanf(\"%d %d\", &hour2, &minute2);\n\nint t1 = hour1 * 60 + minute1;\nint t2 = hour2 * 60 + minute2;\n\nint t = t2 - t1;\n\nprintf(\"时间差是%d小时%d分。\", t / 60, t % 60);", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260730-160802.png", "u": "images/6_QQ20260730-160802.png"}]}, {"id": 7, "date": "1", "title": "第01天-05：运算优先级", "topics": "运算优先级", "summary": "", "codex": "【笔记名称】\n第01天-05：运算优先级\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 运算优先级\n\n【核心概念】\n本节学习“运算优先级”。先用一段最小程序验证语法，再观察每个变量在执行过程中的变化。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    int x = 2 + 3 * 4;\n    int y = (2 + 3) * 4;\n    printf(\"x=%d, y=%d\\n\", x, y);\n    return 0;\n}\n\n【代码拆解】\n1. 从 main 函数入口开始阅读。\n2. 找出输入、核心处理和输出三部分。\n3. 修改一个值并预测结果，再编译验证。\n\n【容易踩坑】\n- 不要只背语法；每次至少运行一个正常值和一个边界值。\n\n【一句话记忆】\n先读懂数据怎么变，再记住语法怎么写。", "code": "", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260730-162345.png", "u": "images/7_QQ20260730-162345.png"}]}, {"id": 8, "date": "1", "title": "第01天-06：复合赋值，递增递减", "topics": "复合赋值，递增递减", "summary": "", "codex": "【笔记名称】\n第01天-06：复合赋值，递增递减\n\n【对应课程】\n翁凯《C语言程序设计》B站网课 · 复合赋值，递增递减\n\n【核心概念】\n本节学习“复合赋值，递增递减”。先用一段最小程序验证语法，再观察每个变量在执行过程中的变化。\n\n【示例代码】\n#include <stdio.h>\n\nint main(void)\n{\n    int n = 5;\n    n += 3;\n    printf(\"%d\\n\", n++);\n    printf(\"%d\\n\", n);\n    return 0;\n}\n\n【代码拆解】\n1. 从 main 函数入口开始阅读。\n2. 找出输入、核心处理和输出三部分。\n3. 修改一个值并预测结果，再编译验证。\n\n【容易踩坑】\n- 不要只背语法；每次至少运行一个正常值和一个边界值。\n\n【一句话记忆】\n先读懂数据怎么变，再记住语法怎么写。", "code": "#include <stdio.h>\n\nint main(void)\n{\n    printf(\"Hello, C language!\\n\");\n    return 0;\n}\n", "reflection": "", "imgs": [{"a": "summary", "n": "QQ20260730-164302.png", "u": "images/8_QQ20260730-164302.png"}, {"a": "summary", "n": "QQ20260730-164331.png", "u": "images/8_QQ20260730-164331.png"}, {"a": "summary", "n": "QQ20260730-181646.png", "u": "images/8_QQ20260730-181646.png"}]}, {"id": 109, "date": "刷题第一天", "title": "BC29 2的n次方计算", "topics": "牛客网BC29；位运算；左移运算符；2的n次方", "summary": "【题目】牛客网 BC29：2的n次方计算\n\n【目标】\n输入一个整数 n，输出 2 的 n 次方。\n\n【核心写法】\n1 << n\n\n在 C 语言里，<< 是左移运算符。把数字 1 向左移 n 位，就相当于计算 2 的 n 次方。\n\n【例子】\nn = 3\n1 << 3 的结果是 8\n\n因为：\n2^3 = 8\n\n从二进制看：\n1 的二进制是 00000001\n左移 3 位后变成 00001000\n00001000 对应的十进制就是 8。", "codex": "BC29 的关键是理解位运算中的左移。对于整数 1，1 << n 等价于 2^n。\n\n记忆：“1 左移 n 位 = 2 的 n 次方”。", "code": "#include <stdio.h>\n\nint main(void)\n{\n    int n;\n\n    scanf(\"%d\", &n);\n\n    printf(\"%d\", 1 << n);\n\n    return 0;\n}", "reflection": "【代码解释】\n\nscanf(\"%d\", &n);\n读入整数 n。\n\nprintf(\"%d\", 1 << n);\n输出 1 左移 n 位的结果，也就是 2 的 n 次方。\n\n【为什么是 n 而不是 n - 1】\n1 本身已经是 2^0。\n左移 1 位得到 2^1。\n左移 2 位得到 2^2。\n左移 n 位得到 2^n。\n\n【常见错误】\n1. 写成 1 << (n - 1)，会少乘一次 2。\n2. 忘记 scanf 里的 &n。\n3. 把 << 看成比较符号，它其实是位运算符。", "imgs": []}, {"id": 110, "date": "刷题第四天", "title": "BC119 小乐乐与字符串", "topics": "牛客网BC119；子序列；字符串；指针遍历；unsigned long long", "summary": "【题目】牛客网 BC119：小乐乐与字符串\n\n【目标】\n输入一个只包含大写字母的字符串 s，统计其中子序列 \"CHN\" 的数量。\n\n【子序列】\n子序列不要求连续，只要相对顺序不变即可。\n例如 ABC 的子序列有 A、B、C、AB、AC、BC、ABC。\n\n【核心思路】\n从左到右遍历字符串，用三个变量统计：\nc：目前遇到过多少个 C。\nch：目前能组成多少个 CH。\nchn：目前能组成多少个 CHN。\n\n遇到 C：c++。\n遇到 H：这个 H 可以和前面每一个 C 组成 CH，所以 ch += c。\n遇到 N：这个 N 可以和前面每一个 CH 组成 CHN，所以 chn += ch。\n", "codex": "BC119 的本质是子序列计数。不需要枚举所有 C、H、N 的组合，只需要从左到右扫一遍，用 c、ch、chn 递推统计。\n\n关键：H 承接前面的 C，N 承接前面的 CH。\n", "code": "#include <stdio.h>\n\nint main(void) {\n    unsigned long long c = 0;\n    unsigned long long ch = 0;\n    unsigned long long chn = 0;\n\n    char arr[8001] = {0};\n    char *p = arr;\n\n    scanf(\"%8000s\", arr);\n\n    while (*p) {\n        if (*p == 'C')\n            c++;\n        else if (*p == 'H')\n            ch = ch + c;\n        else if (*p == 'N')\n            chn = chn + ch;\n\n        p++;\n    }\n\n    printf(\"%llu\\n\", chn);\n\n    return 0;\n}", "reflection": "【代码解释】\n\nchar arr[8001] = {0};\n题目字符串最长是 8000，数组要多开 1 个位置存放字符串结束符 '\\0'。\n\nscanf(\"%8000s\", arr);\n最多读入 8000 个字符，避免数组越界。\n\nwhile (*p)\n等价于 while (*p != '\\0')，表示当前字符还不是字符串结尾，就继续遍历。\n\np++\n让指针移到下一个字符。\n\n【为什么用 unsigned long long】\n结果可能很大，long 在部分编译环境里只有 4 字节，容易溢出。用 unsigned long long 更稳，输出要用 %llu。\n\n【记忆】\n遇到 C 增加 C 的数量；\n遇到 H 增加 CH 的数量；\n遇到 N 增加 CHN 的数量。\n", "imgs": []}, {"id": 108, "date": "刷题第二天", "title": "BC118 小乐乐与序列 [桶排序去重]", "topics": "牛客网BC118；桶排序；去重；数组下标；标记数组；从小到大输出", "summary": "题目：BC118 小乐乐与序列\n\n题意：输入 n 个整数，把这个序列去重后按从小到大输出。\n\n这题最重要的条件：\n每个数 k 的范围是 1 <= k <= n。\n\n因为数字范围很明确，所以可以不用真的比较大小，也不用手写复杂排序。直接开一个“桶数组”记录每个数字有没有出现过。\n\n桶排序在这题里的作用：\n\n1. 用数组下标表示数字本身\n比如 exist[1] 代表数字 1，exist[2] 代表数字 2。\n\n2. 读到某个数字，就把对应桶标记为 1\n读到 x：\nexist[x] = 1;\n\n这表示“数字 x 出现过”。\n\n3. 重复数字天然被去掉\n如果输入里有两个 2：\nexist[2] = 1;\nexist[2] = 1;\n\n重复赋值没有影响，最后还是只记录一次。\n\n4. 从小到大扫描桶数组，天然就是升序\nfor (i = 1; i <= n; i++) {\n    if (exist[i] == 1) {\n        printf(\"%d \", i);\n    }\n}\n\n因为 i 是从 1 到 n 增加的，所以输出顺序一定是从小到大。\n\n和原来“每次找最小值”的思路对比：\n原思路：每一轮在数组里找最小值，输出后再标记掉，还要额外处理重复。\n桶排序：读入时直接标记出现过，最后按下标顺序输出，排序和去重一起完成。\n\n这题的记忆点：\n数字范围小并且连续时，可以考虑用桶。桶数组的下标就是数字，桶里的值表示它有没有出现过。", "codex": "【笔记名称】\nBC118 小乐乐与序列 [桶排序去重]\n\n【天数】\n刷题第二天\n\n【题目】\n牛客网 BC118 小乐乐与序列\n\n【这题的故事】\n一开始想用“反复找最小值”的办法：每轮找当前数组里的最小数，输出后把它改成很大的数。但这个方法容易出错：min 要每轮重新初始化，内外层循环变量不能混用，printf 不能放在找的过程中，还要额外处理重复数字。\n\n后来换成桶排序就简单很多。因为题目保证每个数 k 都在 1 到 n 之间，所以可以开一个 exist 数组，读到 x 就写 exist[x] = 1。重复出现只会反复把同一个位置改成 1，不会多输出。最后从 1 扫到 n，哪个位置是 1 就输出哪个数字。\n\n【核心坑点】\n- 桶数组下标表示数字本身\n- exist[x] = 1 表示 x 出现过\n- 重复数字会落到同一个桶里，所以天然去重\n- 从小到大扫描桶数组，天然升序输出\n- 适合数字范围不大、范围明确的题\n\n【一句话记忆】\n桶排序这题像点名册：来过的人打 1，最后按编号从小到大念一遍。", "code": "#include <stdio.h>\n\nint main()\n{\n    int n = 0;\n    int x = 0;\n    int i = 0;\n    int exist[100001] = {0};\n\n    scanf(\"%d\", &n);\n\n    for (i = 0; i < n; i++) {\n        scanf(\"%d\", &x);\n        exist[x] = 1;\n    }\n\n    for (i = 1; i <= n; i++) {\n        if (exis
